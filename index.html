function parseBackup(text) {
  let o;
  try { o = JSON.parse(String(text || '').trim()); }
  catch (e) { throw new Error('Bu metin okunamadı. Yedeğin tamamını kopyaladığından emin ol.'); }
  if (!o || typeof o !== 'object' || !o.shows || typeof o.shows !== 'object' || !o.watched || typeof o.watched !== 'object') {
    throw new Error('Bu bir Showgenda yedeği gibi görünmüyor.');
  }
  const clean = blank();
  clean.profile.name = String((o.profile && o.profile.name) || '').slice(0, 40);
  for (const s of Object.values(o.shows)) {
    if (!s || !Number.isFinite(+s.id)) continue;
    clean.shows[+s.id] = {
      ...s, id: +s.id, name: String(s.name || 'Adsız dizi'),
      img: safeImg(s.img), imgL: safeImg(s.imgL),
      genres: Array.isArray(s.genres) ? s.genres.map(String) : [],
      eps: Array.isArray(s.eps) ? s.eps.filter(e => Array.isArray(e) && e.length >= 6) : [],
      fav: !!s.fav, stopped: !!s.stopped, fetchedAt: 0,
    };
  }
  for (const [k, w] of Object.entries(o.watched)) {
    if (Array.isArray(w) && w.length >= 2 && Number.isFinite(+k)) clean.watched[k] = [+w[0], +w[1] || 0];
  }
  const s0 = o.settings && typeof o.settings === 'object' ? o.settings : {};
  clean.settings = {
    country: /^[A-Z]{2}$/.test(String(s0.country || '')) ? s0.country : clean.settings.country,
    tmdbKey: String(s0.tmdbKey || '').trim().slice(0, 600),
    mdblistKey: String(s0.mdblistKey || '').trim().slice(0, 200),
    sbUrl: normSbUrl(String(s0.sbUrl || '').slice(0, 300)),
    sbKey: String(s0.sbKey || '').trim().slice(0, 800),
  };
  for (const [k, r] of Object.entries(o.ratings && typeof o.ratings === 'object' ? o.ratings : {})) {
    const v = r ? Math.round(+r.s) : NaN;
    if (Number.isFinite(+k) && v >= 1 && v <= 10) clean.ratings[k] = { s: v, t: +r.t || 0 };
  }
  for (const s of Object.values(clean.shows)) { if (typeof s.trName === 'string') s.trName = s.trName.slice(0, 200); else delete s.trName; }
  for (const [k, v] of Object.entries(o.subs && typeof o.subs === 'object' ? o.subs : {})) {
    if (Number.isFinite(+k) && v && typeof v === 'object') clean.subs[k] = { on: !!v.on, price: Math.max(0, Math.round((+v.price || 0) * 100) / 100), name: String(v.name || '').slice(0, 60), logo: safeImg(v.logo) };
  }
  for (const [k, v] of Object.entries(o.resume && typeof o.resume === 'object' ? o.resume : {})) {
    if (Number.isFinite(+k) && Array.isArray(v) && +v[0] > 0) clean.resume[k] = [Math.min(999, Math.round(+v[0])), +v[1] || 0];
  }
  return clean;
}

async function tmdb(path, params = {}, key = SERVER ? '' : (D.settings.tmdbKey || '').trim()) {
  if (!key && !SERVER) throw apiErr('no_key');
  const u = new URL(key ? TMDB_API + path : API_FN + '/tmdb' + path);
  for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
  const opts = {};
  if (!key) { /* anahtar sunucuda */ }
  else if (/^eyJ/.test(key)) opts.headers = { Authorization: 'Bearer ' + key };
  else u.searchParams.set('api_key', key);
  const res = await fetchT(u.toString(), opts);
  if (res.status === 401) throw apiErr('bad_key');
  if (res.status === 404) throw apiErr('not_found');
  if (res.status === 429) throw apiErr('limit');
  if (!res.ok) throw apiErr('http', 'HTTP ' + res.status, { status: res.status });
  return res.json();
}

    id = (r.tv_results && r.tv_results[0] && r.tv_results[0].id) || null;

  cacheSet('tmdbId', s.id, id);
  if (id) cacheSet('tvmFromTmdb', id, s.id);

async function scoresFor(s) {
  const key = SERVER ? '' : (D.settings.mdblistKey || '').trim();
  if (!key && !SERVER) throw apiErr('no_key');
  if (!s.imdb) return { noid: true };
  const hit = cacheGet('mdb', s.imdb, 3 * DAY);
  if (hit !== undefined) return hit;
  const res = await fetchT(key ? `${MDB_API}/imdb/show/${encodeURIComponent(s.imdb)}?apikey=${encodeURIComponent(key)}` : `${API_FN}/mdb/imdb/show/${encodeURIComponent(s.imdb)}`);
  if (res.status === 401 || res.status === 403) throw apiErr('bad_key');
  if (res.status === 429) throw apiErr('limit');
  if (res.status === 404) { cacheSet('mdb', s.imdb, { none: true }); return { none: true }; }
  if (!res.ok) throw apiErr('http', 'HTTP ' + res.status);
  const j = await res.json();
  if (j && j.error && !j.ratings) throw apiErr(/key/i.test(String(j.error)) ? 'bad_key' : 'http', String(j.error));
  const out = {};
  for (const r of Array.isArray(j && j.ratings) ? j.ratings : []) {
    if (!r || !r.source) continue;
    const value = typeof r.value === 'number' ? r.value : null;
    const score = typeof r.score === 'number' ? r.score : null;
    if (value == null && score == null) continue;
    out[r.source] = { value, score, votes: typeof r.votes === 'number' ? r.votes : null };
  }
  if (!Object.keys(out).length) out.none = true;
  cacheSet('mdb', s.imdb, out);
  return out;
}

// Dış sitelere bağlantı için adres parçası: "Kızılcık Şerbeti" → "kizilcik-serbeti"
function slugify(name) {
  return String(name || '')
    .replace(/[ıİ]/g, 'i').replace(/ß/g, 'ss').replace(/[æÆ]/g, 'ae').replace(/[øØ]/g, 'o').replace(/[łŁ]/g, 'l').replace(/[đĐ]/g, 'd')
    .normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/&/g, ' and ').replace(/['’‘`´]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

  mubi: name => `https://mubi.com/en/cast/${slugify(name)}`,

const CREW_ROWS = [['cre', 'Yaratıcı'], ['dir', 'Yönetmen'], ['wri', 'Senarist'], ['mus', 'Besteci'], ['sup', 'Müzik danışmanı'], ['dop', 'Görüntü yönetmeni']];
const CREW_JOBS = {
  dir: ['Director'],
  wri: ['Writer', 'Screenplay', 'Teleplay', 'Story', 'Head Writer'],
  mus: ['Original Music Composer', 'Music', 'Composer', 'Main Title Theme Composer'],
  sup: ['Music Supervisor'],
  dop: ['Director of Photography'],
};
const CREW_MAX = { cre: 6, dir: 8, wri: 8, mus: 3, sup: 3, dop: 4 };
const tmdbPerson = (p, extra = {}) => ({ id: p.id, name: p.name || p.original_name || '', img: tmdbImg(p.profile_path, 'w185'), ...extra });
// aggregate_credits'te görevler jobs[] içinde (bölüm sayısıyla), bölüm ekibinde tek bir job alanı var
function jobCount(p, jobs) {
  if (Array.isArray(p.jobs)) {
    const hit = p.jobs.filter(j => j && jobs.includes(j.job));
    return hit.length ? Math.max(1, hit.reduce((n, j) => n + (j.episode_count || 0), 0)) : 0;
  }
  return jobs.includes(p.job) ? 1 : 0;
}
function tmdbCrewGroups(crew, created) {
  const list = Array.isArray(crew) ? crew : [];
  const out = { cre: (Array.isArray(created) ? created : []).filter(p => p && p.id).slice(0, CREW_MAX.cre).map(p => tmdbPerson(p)) };
  for (const [k, jobs] of Object.entries(CREW_JOBS)) {
    const seen = new Set(), rows = [];
    for (const p of list) {
      if (!p || !p.id || seen.has(p.id)) continue;
      const n = jobCount(p, jobs);
      if (!n) continue;
      seen.add(p.id);
      rows.push(tmdbPerson(p, { eps: Array.isArray(p.jobs) ? n : 0 }));
    }
    rows.sort((a, b) => b.eps - a.eps);
    out[k] = rows.slice(0, CREW_MAX[k]);
  }
  return out;
}
function tmdbCast(cast, max = 40) {
  const seen = new Set();
  return (Array.isArray(cast) ? cast : []).filter(p => p && p.id && !seen.has(p.id) && seen.add(p.id)).slice(0, max).map(p => {
    const roles = Array.isArray(p.roles) ? p.roles.slice().sort((a, b) => (b.episode_count || 0) - (a.episode_count || 0)) : [];
    return tmdbPerson(p, { role: ((roles[0] && roles[0].character) || p.character || '').trim(), eps: p.total_episode_count || 0 });
  });
}
// Dizinin TMDB ayrıntıları tek istekte: Türkçe özet, oyuncular, ekip ve öneriler
async function tmdbBundle(s) {
  const id = await tmdbIdFor(s);
  if (!id) return { nomatch: true };
  const hit = cacheGet('tvx', id, 3 * DAY);
  if (hit !== undefined) return hit;
  let d;
  try { d = await tmdb(`/tv/${id}`, { language: 'tr-TR', append_to_response: 'aggregate_credits,recommendations' }); }
  catch (e) { if (e.code === 'not_found') return { nomatch: true }; throw e; }
  const ac = d.aggregate_credits || await tmdb(`/tv/${id}/aggregate_credits`, { language: 'tr-TR' }).catch(() => ({}));
  let recs = d.recommendations && Array.isArray(d.recommendations.results) ? d.recommendations.results : null;
  if (!recs) {
    const r = await tmdb(`/tv/${id}/recommendations`, { language: 'tr-TR' }).catch(() => null);
    recs = r && Array.isArray(r.results) ? r.results : [];
  }
  recs = recs.filter(x => x && x.id && x.id !== id);
  if (!recs.length) {
    const r = await tmdb(`/tv/${id}/similar`, { language: 'tr-TR' }).catch(() => null);
    recs = (r && Array.isArray(r.results) ? r.results : []).filter(x => x && x.id && x.id !== id);
  }
  const out = {
    tmdb: id,
    overview: typeof d.overview === 'string' ? d.overview.trim() : '',
    trName: typeof d.name === 'string' ? d.name.trim() : '',
    cast: tmdbCast(ac.cast),
    crew: tmdbCrewGroups(ac.crew, d.created_by),
    recs: recs.slice(0, 18).map(tmdbItem),
  };
  cacheSet('tvx', id, out);
  return out;
}
// TMDB anahtarı yoksa ya da dizi orada eşleşmediyse: TVmaze'in anahtarsız oyuncu ve ekip listesi
async function tvmCredits(s) {
  const hit = cacheGet('tvmc', s.id, 3 * DAY);
  if (hit !== undefined) return hit;
  const [cast, crew] = await Promise.all([
    net.get(`/shows/${s.id}/cast`, { priority: true }),
    net.get(`/shows/${s.id}/crew`, { priority: true }).catch(() => []),
  ]);
  const pm = (p, extra = {}) => ({ id: p.id, name: p.name || '', img: safeImg(p.image && p.image.medium), ...extra });
  const people = new Map();
  for (const c of Array.isArray(cast) ? cast : []) {
    if (!c || !c.person || !c.person.id) continue;
    const role = ((c.character && c.character.name) || (c.self ? 'Kendisi' : '')) + (c.voice ? ' (ses)' : '');
    const prev = people.get(c.person.id);
    if (prev) { if (role && !prev.role.split(' / ').includes(role)) prev.role = prev.role ? prev.role + ' / ' + role : role; continue; }
    people.set(c.person.id, pm(c.person, { role }));
  }
  const test = { cre: /creator|developer/i, dir: /^director$/i, wri: /writer|story|teleplay/i, mus: /composer|^music$|original music/i, sup: /music supervisor/i, dop: /photography|cinematograph/i };
  const groups = { cre: [], dir: [], wri: [], mus: [], sup: [], dop: [] };
  for (const c of Array.isArray(crew) ? crew : []) {
    if (!c || !c.person || !c.person.id || !c.type) continue;
    for (const k of Object.keys(groups)) {
      if (test[k].test(c.type) && groups[k].length < CREW_MAX[k] && !groups[k].some(p => p.id === c.person.id)) groups[k].push(pm(c.person));
    }
  }
  const out = { cast: [...people.values()].slice(0, 40), crew: groups };
  cacheSet('tvmc', s.id, out);
  return out;
}
function creditsState(s) {

    if (b.error && b.error.code !== 'bad_key') return { error: b.error, part: 'bundle', label: 'TMDB' };

  const m = x.tvmc;

function forYouSeeds() {
  const now = Date.now();
  return Object.values(D.shows)
    .filter(s => (s.imdb || s.tvdb) && !s.stopped && !(D.ratings[s.id] && D.ratings[s.id].s < 6))
    .map(s => {
      const st = s.eps ? stats(s, now) : null;
      const r = D.ratings[s.id] ? D.ratings[s.id].s : 0;
      const recent = st && st.lastAt && now - st.lastAt < 30 * DAY ? 10 : 0;
      return { s, w: 1 + (s.fav ? 40 : 0) + r * 5 + Math.min(30, st ? st.watchedCount : 0) + recent };
    })
    .sort((a, b) => b.w - a.w).slice(0, 4);
}
const forYouKey = seeds => seeds.map(x => x.s.id).join(',') + '|' + Object.keys(D.shows).length;
async function loadForYou() {
  const seeds = forYouSeeds();
  const key = forYouKey(seeds);
  if (!seeds.length || (ui.forYou && ui.forYou.key === key)) return;
  ui.forYou = { key, loading: true };
  let err = null;
  const results = await Promise.all(seeds.map(x => tmdbBundle(x.s).then(b => [x, b], e => { err = err || e; return [x, null]; })));
  const followedTmdb = new Set(), followedNames = new Set();
  for (const s of Object.values(D.shows)) {
    const t = cacheGet('tmdbId', s.id);
    if (t) followedTmdb.add(t);
    followedNames.add(slugify(s.name));
  }
  const agg = new Map();
  for (const [x, b] of results) {
    if (!b || !b.recs) continue;
    b.recs.forEach((it, i) => {
      if (followedTmdb.has(it.tmdb) || followedNames.has(slugify(it.name)) || (it.orig && followedNames.has(slugify(it.orig)))) return;
      const w = x.w * (1 - i / 20);
      const a = agg.get(it.tmdb) || { it, score: 0, best: -1, because: '' };
      a.score += w;
      if (w > a.best) { a.best = w; a.because = showTitle(x.s); }
      agg.set(it.tmdb, a);
    });
  }
  if (!ui.forYou || ui.forYou.key !== key) return;   // bu arada liste değişti
  const items = [...agg.values()].sort((a, b) => b.score - a.score).slice(0, 12).map(a => ({ ...a.it, because: a.because }));
  ui.forYou = !items.length && err ? { key, error: err } : { key, items };
  if (route.view === 'discover') renderDiscoverResults();
}
function forYouSection() {
  if (!hasTmdb()) return '';
  const seeds = forYouSeeds();
  if (!seeds.length) return '';
  const st = ui.forYou && ui.forYou.key === forYouKey(seeds) ? ui.forYou : null;
  let body;
  if (!st || st.loading) body = `<div class="center" data-need-foryou="1">${spinner('Öneriler hazırlanıyor')}</div>`;
  else if (st.error) body = st.error.code === 'bad_key'

const DEPT = { Acting: 'Oyuncu', Directing: 'Yönetmen', Writing: 'Senarist', Production: 'Yapımcı', Sound: 'Müzik', Camera: 'Görüntü yönetmeni', Editing: 'Kurgu', Creator: 'Yaratıcı', Art: 'Sanat yönetimi', 'Costume & Make-Up': 'Kostüm ve makyaj', 'Visual Effects': 'Görsel efekt', Crew: 'Ekip', Lighting: 'Işık' };
const LB_ROLE = { Acting: 'actor', Directing: 'director', Writing: 'writer', Sound: 'composer', Camera: 'cinematography', Production: 'producer', Editing: 'editor' };
const JOB_TR = {
  Director: 'Yönetmen', 'Series Director': 'Yönetmen', Writer: 'Senarist', Screenplay: 'Senarist', Teleplay: 'Senarist', Story: 'Hikâye', Novel: 'Roman yazarı',
  'Executive Producer': 'Baş yapımcı', 'Co-Executive Producer': 'Yardımcı baş yapımcı', Producer: 'Yapımcı', Creator: 'Yaratıcı', Developer: 'Geliştiren',
  'Original Music Composer': 'Besteci', Composer: 'Besteci', Music: 'Müzik', 'Music Supervisor': 'Müzik danışmanı', 'Director of Photography': 'Görüntü yönetmeni', Editor: 'Kurgu', Casting: 'Oyuncu seçimi',
};
const SELF_RE = /^(self|himself|herself|themselves|kendisi)\b/i;
async function tmdbPersonData(id) {
  const p = await tmdb(`/person/${id}`, { language: 'tr-TR', append_to_response: 'tv_credits,external_ids' });
  let bio = typeof p.biography === 'string' ? p.biography.trim() : '', bioLang = 'tr';
  if (!bio) {
    const en = await tmdb(`/person/${id}`, { language: 'en-US' }).catch(() => null);
    bio = en && typeof en.biography === 'string' ? en.biography.trim() : '';
    bioLang = 'en';
  }
  const tc = p.tv_credits || {};
  const acting = new Map(), crew = new Map();
  for (const c of Array.isArray(tc.cast) ? tc.cast : []) {
    if (!c || !c.id) continue;
    const eps = c.episode_count || 0;
    const g = Array.isArray(c.genre_ids) ? c.genre_ids : [];
    if (SELF_RE.test(c.character || '') && eps < 20) continue;            // ödül törenleri, konuk olarak katıldığı programlar
    if ((g.includes(10767) || g.includes(10763)) && eps < 3) continue;   // talk show ve haberdeki tek tük görünmeler
    const prev = acting.get(c.id);
    if (prev) { prev.eps += eps; continue; }
    acting.set(c.id, { ...tmdbItem(c), role: (c.character || '').trim(), eps, pop: c.vote_count || 0 });
  }
  for (const c of Array.isArray(tc.crew) ? tc.crew : []) {
    if (!c || !c.id) continue;
    const job = JOB_TR[c.job] || c.job || '';
    const prev = crew.get(c.id);
    if (prev) { if (job && !prev.jobs.includes(job)) prev.jobs.push(job); prev.eps = Math.max(prev.eps, c.episode_count || 0); continue; }
    crew.set(c.id, { ...tmdbItem(c), jobs: job ? [job] : [], eps: c.episode_count || 0, pop: c.vote_count || 0 });
  }
  // Başrolleri ve bilinen dizileri öne al: bölüm sayısı ve dizinin oy sayısı birlikte
  const rank = x => Math.log1p(x.eps) * 2 + Math.log1p(x.pop);
  const order = (a, b) => rank(b) - rank(a);
  const ext = p.external_ids || {};
  return {
    src: 't', id, name: p.name || '', img: tmdbImg(p.profile_path, 'h632'),
    dept: p.known_for_department || '', birthday: p.birthday || '', deathday: p.deathday || '', place: p.place_of_birth || '',
    bio: bio.slice(0, 4000), bioLang, imdb: ext.imdb_id || p.imdb_id || '', url: '',
    acting: [...acting.values()].sort(order).slice(0, 60).map(({ pop, ...x }) => x),
    crew: [...crew.values()].sort(order).slice(0, 40).map(({ pop, jobs, ...x }) => ({ ...x, role: jobs.join(', ') })),
  };
}

    bio: '', bioLang: 'en', imdb: '', url: safeImg(p.url),
    acting: [...acting.values()].sort(byW).slice(0, 60).map(({ w, ...x }) => x),

  };
}

async function episodeExtra(s, e) {
  if (hasTmdb() && e[E_N] != null) {
    const tid = await tmdbIdFor(s).catch(err => { if (err.code === 'bad_key') return null; throw err; });
    if (tid) {
      const key = `${tid}:${e[E_S]}:${e[E_N]}`;
      const hit = cacheGet('epx', key, 3 * DAY);
      if (hit !== undefined) return hit;
      try {
        const r = await tmdb(`/tv/${tid}/season/${e[E_S]}/episode/${e[E_N]}`, { language: 'tr-TR' });
        const crew = tmdbCrewGroups(r.crew, []);
        const out = { src: 't', overview: typeof r.overview === 'string' ? r.overview.trim() : '', dir: crew.dir, wri: crew.wri, guests: tmdbCast(r.guest_stars, 30) };
        cacheSet('epx', key, out);
        return out;
      } catch (err) {
        if (err.code !== 'not_found' && err.code !== 'bad_key') throw err;   // TMDB'de bu bölüm yoksa TVmaze'e düş
      }
    }
  }
  const key = 'm' + e[E_ID];
  const hit = cacheGet('epx', key, 3 * DAY);
  if (hit !== undefined) return hit;
  let failed = 0;
  const soft = p => p.catch(() => { failed++; return []; });
  const [gc, gr] = await Promise.all([
    soft(net.get(`/episodes/${e[E_ID]}/guestcast`, { priority: true })),
    soft(net.get(`/episodes/${e[E_ID]}/guestcrew`, { priority: true })),
  ]);
  if (failed === 2) throw apiErr('network', 'TVmaze yanıt vermedi', { network: true });
  const pm = p => ({ id: p.id, name: p.name || '', img: safeImg(p.image && p.image.medium) });
  const guests = [], dir = [], wri = [];
  for (const c of Array.isArray(gc) ? gc : []) {
    if (!c || !c.person || !c.person.id || guests.some(g => g.id === c.person.id)) continue;
    guests.push({ ...pm(c.person), role: ((c.character && c.character.name) || (c.self ? 'Kendisi' : '')) + (c.voice ? ' (ses)' : '') });
  }
  for (const c of Array.isArray(gr) ? gr : []) {
    const t = (c && (c.guestCrewType || c.type)) || '';
    if (!c || !c.person || !c.person.id) continue;

  return out;

// Aynı anda en fazla n iş: TMDB'ye yüzlerce isteği birden göndermemek için
async function pool(items, n, fn) {
  const out = new Array(items.length);
  let i = 0;
  const worker = async () => { while (i < items.length) { const k = i++; out[k] = await fn(items[k], k); } };
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, worker));
  return out;
}
const faceHtml = (p, cls = '') => `<span class="face${cls ? ' ' + cls : ''}" style="--h:${hue(p.name)}"><span aria-hidden="true">${esc(initials(p.name))}</span>${p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : ''}</span>`;

/* ================= Dizi adı: Orijinal - Türkçe ================= */
function sameTitle(a, b) {
  const x = slugify(a), y = slugify(b);
  if (x && y) return x === y;
  return String(a || '').trim().toLocaleLowerCase('tr') === String(b || '').trim().toLocaleLowerCase('tr');
}
// TVmaze adı (çoğunlukla orijinal ad) önce, TMDB'deki Türkçe adı " - " ile sonra; ikisi aynıysa tek ad
const hasTr = s => !!(s && s.trName && !sameTitle(s.trName, s.name));
const showTitle = s => (!s ? '' : hasTr(s) ? `${s.name} - ${s.trName}` : s.name);
const showTitleHtml = s => (!s ? '' : hasTr(s) ? `${esc(s.name)}<span class="tr-name"> - ${esc(s.trName)}</span>` : esc(s.name));
// TMDB kartları: orijinal adı Latin harfliyse önce o gelir (Korece, Japonca gibi adlarda yalnızca Türkçe ad)
const LATIN_RE = /^[\p{Script=Latin}\p{N}\p{P}\p{S}\s]+$/u;
function tmdbTitle(it) {
  const orig = it.orig || '', loc = it.name || '';
  if (!orig || !loc || sameTitle(orig, loc) || !LATIN_RE.test(orig)) return { main: loc || orig, tr: '' };
  return { main: orig, tr: loc };
}
const tmdbTitleText = it => { const t = tmdbTitle(it); return t.tr ? `${t.main} - ${t.tr}` : t.main; };
const tmdbTitleHtml = it => { const t = tmdbTitle(it); return t.tr ? `${esc(t.main)}<span class="tr-name"> - ${esc(t.tr)}</span>` : esc(t.main); };
function applyTrName(id, name) {
  if (typeof name !== 'string') return;
  for (const s of [D.shows[id], cache.get(id)]) if (s) { s.trName = name.trim().slice(0, 200); s.trAt = Date.now(); }
  if (D.shows[id]) save();
}
let trSyncing = false;
// Takip edilen dizilerin Türkçe adları arka planda, ayda bir tazelenir
async function syncTrNames() {
  if (trSyncing || !hasTmdb()) return;
  const todo = Object.values(D.shows).filter(s => (s.imdb || s.tvdb) && (!('trName' in s) || Date.now() - (s.trAt || 0) > 30 * DAY));
  if (!todo.length) return;
  trSyncing = true;
  let changed = 0;
  try {
    await pool(todo, 3, async s => {
      try {
        const id = await tmdbIdFor(s);
        if (!id) { applyTrName(s.id, ''); return; }
        const d = await tmdb(`/tv/${id}`, { language: 'tr-TR' });
        applyTrName(s.id, typeof d.name === 'string' ? d.name : '');
        changed++;
      } catch (e) { if (e.code === 'bad_key') throw e; }
    });
  } catch (e) { /* anahtar geçersiz: anahtar düzelince yeniden denenir */ }
  trSyncing = false;
  if (changed) update();
}

/* ================= Tanıdık yüzler ================= */
async function personTvCredits(pid) {
  const hit = cacheGet('pcred', pid, 7 * DAY);
  if (hit !== undefined) return hit;
  const r = await tmdb(`/person/${pid}/tv_credits`, { language: 'tr-TR' });
  const list = (Array.isArray(r.cast) ? r.cast : [])
    .filter(c => c && c.id && !SELF_RE.test(c.character || ''))
    .sort((a, b) => (b.vote_count || 0) - (a.vote_count || 0)).slice(0, 150)
    .map(c => [c.id, String(c.character || '').trim().slice(0, 60), c.episode_count || 0]);
  cacheSet('pcred', pid, list);
  return list;
}
// Bu dizinin oyuncularından, kullanıcının en az bir bölümünü izlediği başka dizilerde oynayanlar
async function knownFaces(s, b) {
  const seenIds = new Set(Object.values(D.watched).map(w => w[0]));
  const mine = Object.values(D.shows).filter(x => x.id !== s.id && seenIds.has(x.id) && (x.imdb || x.tvdb));
  if (!mine.length || !b.cast.length) return [];
  const byTmdb = new Map();
  await pool(mine, 4, async x => {
    const t = await tmdbIdFor(x).catch(e => { if (e.code === 'bad_key') throw e; return null; });
    if (t && t !== b.tmdb) byTmdb.set(t, x.id);
  });
  if (!byTmdb.size) return [];
  const cast = b.cast.slice(0, 16);
  const credits = await pool(cast, 4, p => personTvCredits(p.id).catch(e => { if (e.code === 'bad_key') throw e; return []; }));
  const out = [];
  cast.forEach((p, i) => {
    const hits = (credits[i] || []).filter(c => byTmdb.has(c[0]));
    if (hits.length) out.push({ ...p, where: hits.slice(0, 2).map(c => ({ show: byTmdb.get(c[0]), role: c[1] })) });

}
function knownBlock(s) {

}

/* ================= Yetişme planı ================= */
// Toplu işaretlemeler (aynı anda 3+ bölüm) tempoyu şişirmesin diye tek bölüm sayılır
function paceOf(showId, now) {
  const groups = new Map();
  for (const w of Object.values(D.watched)) if (w[0] === showId && now - w[1] < 30 * DAY) groups.set(w[1], (groups.get(w[1]) || 0) + 1);
  let n = 0;
  for (const c of groups.values()) n += c >= 3 ? 1 : c;
  return n / 30;   // bölüm/gün
}
function catchUp(s, st, now) {
  if (!st || s.stopped || st.remaining <= 0) return null;
  const c = { remaining: st.remaining, pace: paceOf(s.id, now) };
  if (st.nextAir && st.nextAir[E_AIR] > now) {
    c.days = Math.max(1, dayDiff(st.nextAir[E_AIR], now));   // kartlardaki "5 gün sonra" ile aynı hesap
    c.need = c.days <= 14 ? `günde ${Math.ceil(st.remaining / c.days)} bölüm` : `haftada ${Math.ceil(st.remaining / (c.days / 7))} bölüm`;
  }
  if (c.pace > 0) c.finishAt = now + Math.ceil(st.remaining / c.pace) * DAY;
  return c;
}
function catchUpText(s, st, now) {
  const c = catchUp(s, st, now);
  if (!c || (!c.need && !c.finishAt)) return '';
  if (!c.need) return `Şu anki hızınla kalan ${nf.format(c.remaining)} bölümü ${longDate(c.finishAt, now)} civarında ${st.ended ? 'bitirirsin' : 'izlemiş olursun'}.`;
  let t = `Yeni bölüme ${c.days} gün var; ${nf.format(c.remaining)} bölümün birikmiş. Yetişmek için ${c.need} izlemelisin.`;
  if (c.finishAt && c.finishAt <= st.nextAir[E_AIR]) t += ` Şu anki hızınla ${longDate(c.finishAt, now)} tarihinde yetişirsin.`;
  else if (c.pace > 0) t += ` Şu anki hızınla yeni bölüm çıktığında ${nf.format(Math.max(1, Math.ceil(c.remaining - c.pace * c.days)))} bölüm geride olursun.`;
  return t;
}
function catchTag(s, st, now) {
  const c = catchUp(s, st, now);
  return c && c.need && c.days <= 60 ? `<span class="catch">yeni bölüme ${c.days} gün · ${esc(c.need)}</span>` : '';
}

/* ================= Abonelik planı ================= */
const EURO = ['DE', 'NL', 'FR', 'BE', 'AT', 'IT', 'ES', 'PT', 'IE', 'FI', 'GR', 'CY'];
function money(v, c = D.settings.country) {
  const cur = c === 'TR' ? 'TRY' : c === 'US' ? 'USD' : c === 'GB' ? 'GBP' : EURO.includes(c) ? 'EUR' : null;
  try { return cur ? new Intl.NumberFormat('tr-TR', { style: 'currency', currency: cur, maximumFractionDigits: 2 }).format(v) : nf.format(v); }
  catch (e) { return nf.format(v); }
}
const subOn = id => !!(D.subs[id] && D.subs[id].on);
const subPrice = id => (D.subs[id] && D.subs[id].price > 0 ? D.subs[id].price : 0);
const planKey = () => `${D.settings.country}|${Object.keys(D.shows).sort().join(',')}|${isoDay()}`;
async function loadPlan() {
  const key = planKey();
  if (ui.plan && ui.plan.key === key) return;
  ui.plan = { key, loading: true };
  const list = Object.values(D.shows).filter(s => !s.stopped);
  try {
    const rows = await pool(list, 4, async s => {
      try { return { id: s.id, prov: await providersFor(s) }; }
      catch (e) { if (e.code === 'bad_key') throw e; return { id: s.id, prov: { error: true } }; }
    });
    if (ui.plan && ui.plan.key === key) ui.plan = { key, rows };
  } catch (e) {
    if (ui.plan && ui.plan.key === key) ui.plan = { key, error: e };
  }
  if (route.view === 'subs') update();
}
function computePlan(rows, now) {
  const need = [], free = [], nowhere = [];
  const provs = new Map();
  for (const r of rows) {
    const s = D.shows[r.id];
    if (!s || s.stopped) continue;
    const st = stats(s, now);
    if (st.state === 'finished') continue;
    const p = r.prov || {};
    const flat = p.flatrate || [];
    for (const x of flat) if (!provs.has(x.id)) provs.set(x.id, { id: x.id, name: x.name, logo: x.logo, need: [], later: [] });
    const item = { s, st };
    const soon = st.nextAir && st.nextAir[E_AIR] - now <= 30 * DAY;
    // Birikmiş bölümler: son 60 günde izlediysen ya da diziyi yeni eklediysen bu ay gerekli sayılır
    const active = st.remaining > 0 && ((st.lastAt && now - st.lastAt < 60 * DAY) || (!st.watchedCount && now - (s.addedAt || 0) < 14 * DAY));
    if (active || soon) {
      if ((p.free || []).length) free.push(item);
      else if (!flat.length) nowhere.push(item);
      else { need.push(item); flat.forEach(x => provs.get(x.id).need.push(item)); }
    } else if (st.nextAir) flat.forEach(x => provs.get(x.id).later.push(item));
  }
  // Önceden abone olunanlar da listede kalsın (bu ay hiçbir dizide görünmeseler bile)
  for (const [id, v] of Object.entries(D.subs)) if (v && v.on && !provs.has(+id)) provs.set(+id, { id: +id, name: v.name || 'Platform', logo: v.logo || '', need: [], later: [] });
  // Bu ay gereken dizileri en az platformla karşılayan seçim; eşitlikte ucuz olan
  const pick = (cands, items) => {
    const left = new Set(items.map(i => i.s.id)), chosen = [];
    for (;;) {
      let best = null, bestN = 0;
      for (const p of cands) {
        if (chosen.includes(p)) continue;
        const n = p.need.filter(i => left.has(i.s.id)).length;
        if (n > bestN || (n && n === bestN && subPrice(p.id) < subPrice(best.id))) { best = p; bestN = n; }
      }
      if (!best) break;
      chosen.push(best);
      best.need.forEach(i => left.delete(i.s.id));
    }
    return { chosen, left };
  };
  const all = [...provs.values()].sort((a, b) => a.name.localeCompare(b.name, 'tr'));
  const mine = all.filter(p => subOn(p.id));
  const keep = pick(mine, need);
  const pause = mine.filter(p => !keep.chosen.includes(p));
  const open = pick(all.filter(p => !subOn(p.id)), need.filter(i => keep.left.has(i.s.id)));
  return {
    all, mine, keep: keep.chosen, pause, open: open.chosen, need, free, nowhere,
    saving: pause.reduce((n, p) => n + subPrice(p.id), 0),
    cost: keep.chosen.concat(open.chosen).reduce((n, p) => n + subPrice(p.id), 0),
  };
}
function planReason(i, now) {
  const st = i.st, parts = [];
  if (st.remaining) parts.push(`${nf.format(st.remaining)} bölüm birikmiş`);
  if (st.nextAir && st.nextAir[E_AIR] - now <= 30 * DAY) parts.push(`yeni bölüm ${shortDate(st.nextAir[E_AIR], now)}`);
  return parts.join(' · ');
}

// Hesaba yalnızca kullanıcının kendi işaretleri gider; dizi ve bölüm bilgileri her cihazda TVmaze'den yeniden alınır

function applySyncState(st) {

    const cur = D.shows[id] || cache.get(+id) || { id: +id, name: String(x.n || 'Dizi'), img: safeImg(x.i), genres: [], eps: [], fetchedAt: 0 };

async function pushState(state, rev) {
  const uid = sb.uid();
  const body = { data: state, updated_at: new Date().toISOString() };
  const rows = rev
    ? await sb.rest(`user_data?user_id=eq.${uid}&updated_at=eq.${encodeURIComponent(rev)}`, { method: 'PATCH', body, prefer: 'return=representation' })
    : await sb.rest('user_data?on_conflict=user_id', { method: 'POST', body: { user_id: uid, ...body }, prefer: 'resolution=merge-duplicates,return=representation' });
  if (!Array.isArray(rows) || !rows.length) return false;   // bu arada başka bir cihaz yazmış
  syncMeta = { uid, rev: rows[0].updated_at, hash: hashStr(JSON.stringify(state)), at: Date.now() };
  saveSyncMeta();

}
function syncNow(pull = false) {
  if (!SERVER || !sb.loggedIn()) return Promise.resolve();
  if (syncBusy) return syncBusy.then(() => syncNow(pull));
  syncBusy = (async () => {
    const uid = sb.uid();
    if (syncMeta.uid !== uid) syncMeta = { uid };
    for (let attempt = 0; attempt < 3; attempt++) {
      const local = syncState();
      const dirty = hashStr(JSON.stringify(local)) !== syncMeta.hash;
      if (!pull && syncMeta.rev) {
        if (!dirty) return;
        if (await pushState(local, syncMeta.rev)) return;
        pull = true;
        continue;
      }
      const rows = await sb.rest(`user_data?select=data,updated_at&user_id=eq.${uid}`);
      lastPull = Date.now();
      const row = Array.isArray(rows) ? rows[0] : null;
      if (!row) { if (await pushState(local, null)) return; continue; }
      if (row.updated_at === syncMeta.rev) {
        if (!dirty) { syncMeta.at = Date.now(); saveSyncMeta(); return; }
        if (await pushState(local, row.updated_at)) return;
        continue;
      }
      // Hesapta daha yeni bir sürüm var: bu cihazda değişiklik yoksa onu al, varsa birleştir
      const adopt = !!syncMeta.rev && !dirty;
      applySyncState(adopt ? (row.data || {}) : mergeStates(local, row.data || {}));
      save(true, true);
      update();
      refreshAll();
      if (adopt) {
        syncMeta = { uid, rev: row.updated_at, hash: hashStr(JSON.stringify(syncState())), at: Date.now() };
        saveSyncMeta();
        return;
      }
      if (await pushState(syncState(), row.updated_at)) return;
    }
  })().finally(() => { syncBusy = null; });
  return syncBusy;
}

document.addEventListener('keydown', ev => {
  if (!acctOpen) return;
  const items = $$('#acctPop [role="menuitem"]');
  const i = items.indexOf(document.activeElement);
  if (ev.key === 'Escape') { ev.preventDefault(); setAcctMenu(false, true); }
  else if (ev.key === 'ArrowDown') { ev.preventDefault(); (items[i + 1] || items[0]).focus(); }
  else if (ev.key === 'ArrowUp') { ev.preventDefault(); (items[i - 1] || items[items.length - 1]).focus(); }
  else if (ev.key === 'Tab') setAcctMenu(false);
});

async function ensureEpisode(epId) {
  if (ui.epInfo.has(epId) || ui.epLoading.has(epId)) return;
  ui.epLoading.add(epId);
  try {
    const r = await net.get(`/episodes/${epId}`, { priority: true });
    ui.epInfo.set(epId, { summary: stripHtml(r.summary).slice(0, 1400), img: safeImg(r.image && (r.image.original || r.image.medium)) });
  } catch (e) {
    ui.epInfo.set(epId, { error: true });
  } finally {
    ui.epLoading.delete(epId);
    if (route.view === 'episode' && route.ep === epId) update();
  }
}

  if (SERVER) return `<div class="sec">${accountCard()}</div>`;
  const row = (label, k) => `<div class="conn-row"><span>${label}</span>${keyPill(k)}</div>`;
  return `<section class="sec"><div class="sec-head"><h2>Ayarlar ve bağlantılar</h2></div>
    <div class="databox"><div class="conn">${row('Puanlar (MDBList)', 'mdblistKey')}${row('Trend ve platformlar (TMDB)', 'tmdbKey')}${row('Ortak yorumlar ve puanlar (Supabase)', 'sb')}</div>
    <div class="btnrow"><a class="btn btn-sm" href="#ayarlar">${ICON.gear}<span>Ayarları aç</span></a></div></div></section>`;
}

/* ================= Yönlendirme ve çizim ================= */
const VIEWS = { gate: viewGate, privacy: viewPrivacy, watchlist: viewWatchlist, upcoming: viewUpcoming, discover: viewDiscover, profile: viewProfile, show: viewShow, episode: viewEpisode, settings: viewSettings, person: viewPerson, subs: viewSubs };
const TITLES = { gate: 'Giriş', privacy: 'Gizlilik', watchlist: 'İzleme listesi', upcoming: 'Yaklaşanlar', discover: 'Keşfet', profile: 'Profil', settings: 'Ayarlar', person: 'Kişi', subs: 'Abonelik planı' };

function parseRoute() {
  let h = location.hash.replace(/^#/, '');
  try { h = decodeURIComponent(h); } catch (e) { /* bozuk adres: ana sayfaya düş */ }
  let m = h.match(/^dizi-(\d+)$/);
  if (m) return { view: 'show', id: +m[1] };
  m = h.match(/^bolum-(\d+)-(\d+)$/);
  if (m) return { view: 'episode', id: +m[1], ep: +m[2] };
  m = h.match(/^kisi-([tm])(\d+)$/);
  if (m) return { view: 'person', src: m[1], id: +m[2] };
  if (h === 'yaklasanlar') return { view: 'upcoming' };
  if (h === 'kesfet') return { view: 'discover' };
  if (h === 'profil') return { view: 'profile' };
  if (h === 'ayarlar') return { view: 'settings' };
  if (h === 'abonelik') return { view: 'subs' };
  if (h === 'giris') return { view: 'gate' };
  if (h === 'gizlilik') return { view: 'privacy' };
  return { view: 'watchlist' };
}
const routeKey = r => r.view + (r.src || '') + (r.id ? '-' + r.id : '') + (r.ep ? '-' + r.ep : '');
function setNav() {
  const gear = $('#gearLink');
  if (gear) { if (route.view === 'settings') gear.setAttribute('aria-current', 'page'); else gear.removeAttribute('aria-current'); }
  const top = { watchlist: 'diziler', upcoming: 'diziler', discover: 'kesfet', profile: 'profil', settings: 'profil', subs: 'profil' }[route.view];
  if (!top) return;
  for (const a of $$('[data-nav]')) {
    if (a.dataset.nav === top) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  }
}
function setTitle(v = viewName()) {
  let t = TITLES[v] || 'Diziler';
  const s = v === 'show' || v === 'episode' ? getShow(route.id) : null;
  if (s && v === 'show') t = showTitle(s);
  if (s && v === 'episode') {
    const e = (s.eps || []).find(x => x[E_ID] === route.ep);
    t = e ? `${showTitle(s)} ${epLabel(s, e)}` : showTitle(s);
  }
  if (v === 'person') { const p = ui.person[route.src + route.id]; if (p && p.data && p.data.name) t = p.data.name; }
  document.title = `${t} · ${BRAND.name}`;
}
function hydrate(v = viewName()) {
  if (v === 'gate' || v === 'privacy') {
    for (const el of $$('[data-need-trend]')) { const w = el.dataset.needTrend; if (!ui.trend[w]) loadTrend(w); }
    return;
  }
  for (const el of $$('[data-need-sched]')) { const r = el.dataset.needSched; if (!ui.sched[r]) loadSched(r); }
  for (const el of $$('[data-need-trend]')) { const w = el.dataset.needTrend; if (!ui.trend[w]) loadTrend(w); }
  if ($('[data-need-foryou]')) loadForYou();
  if ($('[data-need-plan]')) loadPlan();
  if (route.view === 'person') ensurePerson(route.src, route.id);
  if (route.view === 'show') { ensureShow(route.id); ensureExtras(route.id); }
  if (route.view === 'episode') { ensureShow(route.id); ensureEpisode(route.ep); ensureSocial(route.id); ensureEpExtra(route.id, route.ep); }
}
function applyChrome(v) {
  document.body.classList.toggle('gated', chromeHidden(v));
  if (!acctOpen) renderTopAcct();
}
function mount() {
  if (route.view === 'gate' && SERVER && sb.loggedIn()) { history.replaceState(null, '', '#diziler'); route = parseRoute(); }
  const v = viewName();
  if (acctOpen) setAcctMenu(false);
  applyChrome(v);
  setNav();
  $('#view').innerHTML = VIEWS[v](route);
  setTitle(v);
  hydrate(v);
  if (v === 'discover' && ui.q.trim().length >= 2 && ui.search.q !== ui.q.trim()) runSearch(true);
}
// force: kullanıcının kendi işlemi. Arka plan güncellemeleri, yazı yazılan bir alanı silmesin diye bekler.
function update(force = false) {
  const v = viewName();
  if (chromeHidden(v) !== document.body.classList.contains('gated') || (v === 'gate') !== !!$('#view .gate')) { mount(); return; }
  if (v === 'gate') { patchGate(); return; }
  applyChrome(v);
  if (v === 'discover') { renderDiscoverResults(); return; }
  const view = $('#view');
  const active = document.activeElement;
  if (!force && active && view.contains(active) && active.matches('input:not([type="checkbox"]), select, textarea') && !active.dataset.draft) return;
  const fk = active && active.dataset ? active.dataset.focus : null;
  let sel = null;
  try { if (active && typeof active.selectionStart === 'number') sel = [active.selectionStart, active.selectionEnd]; } catch (e) { sel = null; }
  const y = window.scrollY;
  view.innerHTML = VIEWS[v](route);
  window.scrollTo(0, y);
  if (fk) {
    const el = document.querySelector(`[data-focus="${CSS.escape(fk)}"]`);
    if (el) {
      el.focus({ preventScroll: true });
      if (sel) { try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* yok say */ } }
    }
  }
  setTitle(v);
  hydrate(v);
}

const navStack = [location.hash || '#diziler'];
const scrollMemo = {};
addEventListener('hashchange', () => {
  scrollMemo[routeKey(route)] = window.scrollY;
  const h = location.hash || '#diziler';
  if (navStack.length > 1 && navStack[navStack.length - 2] === h) navStack.pop(); else navStack.push(h);
  route = parseRoute();
  ui.editingName = false;
  mount();
  const toTop = ['show', 'episode', 'settings', 'person', 'gate', 'privacy'].includes(viewName());
  window.scrollTo(0, toTop ? 0 : (scrollMemo[routeKey(route)] || 0));
  $('#view').focus({ preventScroll: true });
});
function goBack() {
  if (navStack.length > 1) history.back();
  else location.hash = '#diziler';
}

/* ================= Olaylar ================= */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act, id = +el.dataset.id || 0;
  switch (act) {
    case 'watch-next': watchNext(id, +el.dataset.ep, el); break;
    case 'ep': toggleEp(id, +el.dataset.ep); break;
    case 'season-all': toggleSeason(id, +el.dataset.season); break;
    case 'season-open': {
      const set = ui.open[id] || (ui.open[id] = new Set());
      const n = +el.dataset.season;
      if (set.has(n)) set.delete(n); else set.add(n);
      update(true);
      break;
    }
    case 'follow': follow(id, el); break;
    case 'unfollow': unfollow(id); break;
    case 'fav': toggleFav(id); break;
    case 'stop': toggleStop(id); break;
    case 'all': markAll(id); break;
    case 'region': ui.region = el.dataset.region; update(); break;
    case 'retry-sched': delete ui.sched[ui.region]; update(); break;
    case 'retry-search': runSearch(true); break;
    case 'retry-show': ui.showErr.delete(id); ensureShow(id, true); update(true); break;
    case 'back': goBack(); break;
    case 'sync': refreshAll(true); break;
    case 'edit-name': ui.editingName = true; update(true); { const i = $('#nameInput'); if (i) { i.focus(); i.select(); } } break;
    case 'cancel-name': ui.editingName = false; update(true); break;
    case 'export': exportFile(); break;
    case 'copy': copyBackup(); break;
    case 'import-file': $('#importFile').click(); break;
    case 'import-paste': importPaste(); break;
    case 'wipe': wipe(); break;
    case 'trend-win': ui.trendWin = el.dataset.win === 'day' ? 'day' : 'week'; update(); break;
    case 'retry-trend': delete ui.trend[ui.trendWin]; update(); break;
    case 'open-tmdb': openTmdb(+el.dataset.tmdb, el); break;
    case 'retry-foryou': ui.forYou = null; update(); break;
    case 'retry-person': delete ui.person[route.src + route.id]; update(true); break;
    case 'retry-epx': delete ui.epx[el.dataset.key]; update(true); break;
    case 'bio-more': { const k = el.dataset.key; if (ui.bioOpen.has(k)) ui.bioOpen.delete(k); else ui.bioOpen.add(k); update(true); break; }
    case 'more-credits': ui.moreCredits.add(el.dataset.key); update(true); break;
    case 'retry-plan': ui.plan = null; update(true); break;
    case 'resume-clear': delete D.resume[+el.dataset.ep]; save(); update(true); break;
    case 'login': startLogin(); break;
    case 'guest': lsSet(GUEST_KEY, '1'); ui.gate.msg = ''; if (route.view === 'gate') location.hash = '#diziler'; else mount(); break;
    case 'acct-menu': setAcctMenu(!acctOpen); break;
    case 'logout': logout(); break;
    case 'sync-account': syncNow(true).then(() => { update(true); toast({ text: 'Eşitlendi.' }); }, e => toast({ kind: 'error', text: sbErrorText(e) })); break;
    case 'report-comment': reportComment(id, +el.dataset.cid); break;
    case 'hide-comment': setHidden(id, +el.dataset.cid, el.dataset.hide === '1'); break;
    case 'rate': rateShow(id, +el.dataset.score); break;
    case 'unrate': unrateShow(id); break;
    case 'reveal': ui.reveal[el.dataset.key] = true; update(true); break;
    case 'del-comment': deleteComment(id, +el.dataset.cid); break;
    case 'retry-social': if (ui.social[id]) ui.social[id].error = null; ensureSocial(id, true); update(true); break;
    case 'retry-ext': { const x = ui.ext[id]; if (x) delete x[el.dataset.part]; update(true); break; }
    case 'clear-key': {
      const k = el.dataset.key;
      D.settings[k] = ''; delete ui.keyState[k];
      save(); resetExternal(); update(true);
      toast({ text: `${KEY_LABEL[k]} anahtarı kaldırıldı.` });
      break;
    }
    case 'sb-disconnect':
      D.settings.sbUrl = ''; D.settings.sbKey = ''; sb.reset(); delete ui.keyState.sb;
      save(); resetExternal(); update(true);
      toast({ text: 'Ortak alan bağlantısı kaldırıldı.' });
      break;
    case 'copy-sql': copyText(SQL_SETUP, 'Kurulum SQL\'i kopyalandı. Supabase SQL Editor\'e yapıştırıp Run\'a bas.', 'Kurulum SQL\'i'); break;
    case 'copy-invite': {
      const box = $('#inviteKeys');
      copyText(inviteCode(!!(box && box.checked)), 'Davet kodu kopyalandı. Arkadaşına gönder; o da Ayarlar sayfasına yapıştırsın.', 'Davet kodu');
      break;
    }
  }
});
document.addEventListener('submit', ev => {
  const f = ev.target.closest('form[data-form]');
  if (!f) return;
  ev.preventDefault();
  const kind = f.dataset.form;
  if (kind === 'search') {
    ui.q = f.elements.q.value;
    runSearch();
    if (matchMedia('(pointer: coarse)').matches) f.elements.q.blur();
  } else if (kind === 'go-search') {
    ui.q = f.elements.q.value.trim();
    location.hash = '#kesfet';
  } else if (kind === 'name') {
    D.profile.name = f.elements.name.value.trim().slice(0, 40);
    ui.editingName = false;
    save(); update(true);
    const b = $('[data-focus="edit-name"]'); if (b) b.focus();
  } else if (kind === 'comment') {
    submitComment(f);
  } else if (kind === 'resume') {
    const m = Math.round(+String(f.elements.m.value).trim());
    if (!(m > 0 && m < 1000)) { f.elements.m.focus(); return; }
    D.resume[+f.dataset.resume] = [m, Date.now()];
    save();
    if (document.activeElement && f.contains(document.activeElement)) document.activeElement.blur();
    update(true);
    toast({ text: `${m}. dakikada kaldığın kaydedildi.` });
  } else if (kind === 'basics') {
    const c = f.elements.country.value;
    if (c !== D.settings.country) ui.ext = {};
    D.settings.country = c;
    D.profile.name = f.elements.name.value.trim().slice(0, 40);
    save(); update(true);
    toast({ text: 'Kaydedildi.' });
  } else if (kind === 'key') {
    const k = f.dataset.key;
    D.settings[k] = f.elements.value.value.trim();
    save(); resetExternal();
    if (D.settings[k]) testKey(k); else { delete ui.keyState[k]; update(true); }
  } else if (kind === 'sb') {
    D.settings.sbUrl = normSbUrl(f.elements.url.value);
    D.settings.sbKey = f.elements.key.value.trim();
    save(); sb.reset(); resetExternal();
    if (sb.ready()) testKey('sb');
    else { ui.keyState.sb = { state: 'bad', msg: 'Project URL ve anahtar birlikte gerekli.' }; update(true); }
  } else if (kind === 'invite') {
    try {
      const o = parseInvite(f.elements.code.value);
      D.settings.sbUrl = normSbUrl(o.u);
      D.settings.sbKey = o.k;
      if (o.t) D.settings.tmdbKey = o.t;
      if (o.m) D.settings.mdblistKey = o.m;
      save(); sb.reset(); resetExternal();
      ui.keyState.invite = { state: 'ok', msg: 'Davet kodu uygulandı.' + (o.t || o.m ? ' API anahtarları da eklendi.' : '') };
      testKey('sb');
    } catch (e) {
      ui.keyState.invite = { state: 'bad', msg: e.message };
      update(true);
    }
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.draft) { ui.drafts[t.dataset.draft] = t.value; return; }
  if (t.id !== 'q') return;
  ui.q = t.value;
  clearTimeout(searchTimer);
  if (ui.q.trim().length < 2) { if (searchCtrl) searchCtrl.abort(); renderDiscoverResults(); return; }
  searchTimer = setTimeout(() => runSearch(), 380);
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.draftSp) ui.drafts[t.dataset.draftSp + ':sp'] = t.checked;
  if (t.id === 'inviteKeys') ui.inviteKeys = t.checked;
  if (t.dataset && (t.dataset.subOn || t.dataset.subPrice)) {
    const id = +(t.dataset.subOn || t.dataset.subPrice);
    const cur = D.subs[id] || (D.subs[id] = { on: false, price: 0, name: t.dataset.name || '', logo: t.dataset.logo || '' });
    if (t.dataset.subOn) cur.on = t.checked;
    else cur.price = Math.max(0, Math.round((+String(t.value).replace(/\s/g, '').replace(',', '.') || 0) * 100) / 100);
    save(); update(true);
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && ui.editingName && ev.target.id === 'nameInput') { ui.editingName = false; update(true); }
});
$('#importFile').addEventListener('change', async ev => {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  try { applyImport(parseBackup(await file.text())); }
  catch (e) { toast({ kind: 'error', text: e.message || 'Yedek okunamadı.' }); }
});
addEventListener('online', () => { renderSync(); refreshAll(); });
addEventListener('offline', renderSync);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { save(true); return; }
  refreshAll();
  if (SERVER && sb.loggedIn() && Date.now() - lastPull > 60000) syncNow(true).catch(() => {});
  const a = document.activeElement;
  if (!a || !a.matches('input, textarea, select')) update();
});
// Geri sayımlar ("3 saat sonra") dakikada bir tazelenir
setInterval(() => {
  if (document.visibilityState !== 'visible' || route.view === 'discover' || !$('#dialog').hidden) return;
  const a = document.activeElement;
  if (a && a.matches('input, textarea, select')) return;
  update();
}, 60000);

/* ================= Başlat ================= */
$('#brandMark').innerHTML = ICON.logo;
for (const el of $$('[data-icon]')) el.outerHTML = ICON[el.dataset.icon];
load();
purgeLegacyKeys();
const oauthBack = takeOAuthReturn();
if (oauthBack && oauthBack.error) { ui.gate.msg = authErrorText(oauthBack.error); ui.gate.err = true; }
route = parseRoute();
mount();
renderSync();
refreshAll();
checkAuth();
if (oauthBack && oauthBack.ok) afterLogin(true);
else if (SERVER && sb.loggedIn()) afterLogin(false);
})();
</script>
</body>

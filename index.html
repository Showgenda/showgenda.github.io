<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#3442d9">
<title>Showgenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233442d9'/%3E%3Crect x='8' y='9' width='16' height='15' rx='3' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3Cpath d='M12 6.5v4.5M20 6.5v4.5' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3Cpath d='M14.2 13.6v6.2l5.2-3.1z' fill='%23ff6b4a'/%3E%3C/svg%3E">
<style>
:root {
  /* Showgenda — kişisel dizi ajandası: serin kâğıt zemin, ultramarin mürekkep, mercan fosforlu kalem.
     Başlık: Bricolage Grotesque · metin: Instrument Sans · saat ve bölüm kodları: DM Mono.
     Yerleşim: mobilde yüzen alt menü, 760px üstünde üst menü; içerik 1120px'lik tek kolon. */
  --bg: #f4f4f8;
  --surface: #ffffff;
  --surface-2: #ebebf2;
  --ink: #16172c;
  --muted: #5d5f76;
  --line: #e1e1ea;
  --line-strong: #c6c7d6;
  --brand: #3442d9;
  --brand-ink: #ffffff;
  --brand-soft: #e7e8fc;
  --hi: #ff6b4a;
  --hi-ink: #16172c;
  --hi-soft: #ffe7df;
  --heart: #e2336a;
  --heart-soft: #fde3ec;
  --ok: #10805c;
  --dot-run: #1da87a;
  --dot-end: #9a9cb3;
  --dot-wait: #e49a2c;
  --err-bg: #ffe2d9;
  --err-ink: #6b1a0c;
  --toast-bg: #16172c;
  --toast-ink: #f4f4fa;
  --toast-act: #aab0ff;
  --cover: #3442d9;
  --cover-ink: #ffffff;
  --cover-muted: rgba(255, 255, 255, .74);
  --cover-tile: rgba(255, 255, 255, .13);
  --shadow: 0 1px 2px rgba(22, 23, 44, .05), 0 4px 16px rgba(22, 23, 44, .06);
  --font-display: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --font-body: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0e19; --surface: #161729; --surface-2: #232539; --ink: #ececf6; --muted: #a2a4bd; --line: #26283f; --line-strong: #3b3e5e;
    --brand: #8e95ff; --brand-ink: #0d0e19; --brand-soft: #262a5e; --hi: #ff8a6b; --hi-ink: #0d0e19; --hi-soft: #3a1f18;
    --heart: #ff5c8a; --heart-soft: #4a1d2c; --ok: #5fd3a6; --err-bg: #4a2219; --err-ink: #ffe0d7;
    --toast-bg: #ececf6; --toast-ink: #16172c; --toast-act: #3442d9;
    --cover: #262a5e; --cover-ink: #f4f4fa; --cover-muted: rgba(244, 244, 250, .7); --cover-tile: rgba(255, 255, 255, .08);
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0e19; --surface: #161729; --surface-2: #232539; --ink: #ececf6; --muted: #a2a4bd; --line: #26283f; --line-strong: #3b3e5e;
  --brand: #8e95ff; --brand-ink: #0d0e19; --brand-soft: #262a5e; --hi: #ff8a6b; --hi-ink: #0d0e19; --hi-soft: #3a1f18;
  --heart: #ff5c8a; --heart-soft: #4a1d2c; --ok: #5fd3a6; --err-bg: #4a2219; --err-ink: #ffe0d7;
  --toast-bg: #ececf6; --toast-ink: #16172c; --toast-act: #3442d9;
  --cover: #262a5e; --cover-ink: #f4f4fa; --cover-muted: rgba(244, 244, 250, .7); --cover-tile: rgba(255, 255, 255, .08);
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
img { max-width: 100%; display: block; }
a { color: inherit; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 2.5px solid var(--brand); outline-offset: 2px; }
#view:focus { outline: none; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }

.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
main { padding-bottom: calc(112px + env(safe-area-inset-bottom)); }
@media (min-width: 760px) { main { padding-bottom: 56px; } }

/* Üst çubuk */
.topbar { position: sticky; top: 0; z-index: 30; background: var(--bg); background: color-mix(in srgb, var(--bg) 86%, transparent); -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
.topbar-in { display: flex; align-items: center; gap: 16px; min-height: 60px; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font: 800 20px/1 var(--font-display); letter-spacing: -.025em; white-space: nowrap; }
.brand b { color: var(--brand); font-weight: 800; }
.brand-mark { width: 34px; height: 34px; border-radius: 11px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 22px; height: 22px; stroke-width: 2; }
.mainnav { display: none; }
.sync { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: 500 12.5px/1 var(--font-mono); white-space: nowrap; }
.sync svg { width: 15px; height: 15px; flex: none; }
.sync:hover:not(:disabled) { color: var(--ink); border-color: var(--line-strong); }
.sync:disabled { cursor: default; }
@media (max-width: 430px) { .sync-l { display: none; } }
@media (min-width: 760px) {
  .mainnav { display: flex; gap: 4px; margin-left: 22px; }
  .mainnav a { display: flex; align-items: center; height: 38px; padding: 0 14px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 15px; color: var(--muted); }
  .mainnav a:hover { color: var(--ink); background: var(--surface-2); }
  .mainnav a[aria-current="page"] { color: var(--brand); background: var(--brand-soft); }
}

/* Yüzen alt menü (mobil) */
.tabbar { position: fixed; left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 30; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 6px; border-radius: 22px; background: var(--surface); background: color-mix(in srgb, var(--surface) 90%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(22, 23, 44, .16); }
.tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 6px; border-radius: 16px; text-decoration: none; color: var(--muted); font-size: 12.5px; font-weight: 600; }
.tabbar svg { width: 24px; height: 24px; stroke-width: 1.8; }
.tabbar a[aria-current="page"] { color: var(--brand); background: var(--brand-soft); }
.tabbar a[aria-current="page"] svg { stroke-width: 2.2; }
@media (min-width: 760px) { .tabbar { display: none; } }

/* Diziler sekmeleri: bölmeli anahtar */
.subtabs { padding-top: 16px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-2); }
.seg a { display: flex; align-items: center; justify-content: center; min-height: 42px; padding: 0 12px; border-radius: 11px; text-decoration: none; font-weight: 600; font-size: 15px; color: var(--muted); }
.seg a:hover { color: var(--ink); }
.seg a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
@media (min-width: 760px) { .seg { display: inline-grid; grid-template-columns: auto auto; } .seg a { padding: 0 24px; } }

/* Sayfa başı: ajanda notu */
.summary { margin-top: 24px; display: grid; gap: 8px; }
.summary .date { font: 500 13px/1.2 var(--font-mono); color: var(--muted); }
.summary .lead { font: 700 clamp(25px, 4.8vw, 36px)/1.1 var(--font-display); letter-spacing: -.025em; text-wrap: balance; }
.summary .lead em { font-style: normal; color: var(--brand); }
.summary .sub { font-size: 15.5px; color: var(--muted); }
.summary .sub a { color: var(--brand); font-weight: 600; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.page-title { margin: 26px 0 16px; font: 800 34px/1.05 var(--font-display); letter-spacing: -.03em; }

.sec { margin-top: 36px; }
.sec-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
.sec-head h2 { margin: 0; font: 700 22px/1.2 var(--font-display); letter-spacing: -.015em; }
.sec-head .i-heart { width: 22px; height: 22px; fill: var(--heart); stroke: var(--heart); align-self: center; flex: none; }
.count { font: 500 13px/1 var(--font-mono); color: var(--muted); }

/* Afiş */
.poster { position: relative; aspect-ratio: 2 / 3; border-radius: 10px; overflow: hidden; background: linear-gradient(160deg, hsl(var(--h) 58% 80%), hsl(calc(var(--h) + 45) 50% 62%)); isolation: isolate; box-shadow: inset 0 0 0 1px rgba(22, 23, 44, .06); }
.poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.poster-fb { position: absolute; inset: 0; display: grid; place-items: center; font: 800 22px/1 var(--font-display); color: rgba(22, 23, 44, .66); letter-spacing: -.01em; }
.poster-sm .poster-fb { font-size: 17px; }
.poster-xs { width: 40px; border-radius: 7px; }
.poster-xs .poster-fb { font-size: 12px; }
.poster-lg { border-radius: 16px; box-shadow: 0 18px 40px rgba(22, 23, 44, .22); }
.poster-lg .poster-fb { font-size: 46px; }

.epcode { display: inline-block; padding: 3px 7px; margin-right: 6px; border-radius: 7px; background: var(--brand-soft); color: var(--brand); font: 500 12.5px/1.2 var(--font-mono); white-space: nowrap; vertical-align: 1px; }
.bar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: inherit; background: var(--brand); }
.bar-lg { height: 8px; }

/* Durum: renkli nokta + yazı */
.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 12.5px/1.2 var(--font-mono); color: var(--muted); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.pill-run::before { background: var(--dot-run); }
.pill-end::before { background: var(--dot-end); }
.pill-wait::before { background: var(--dot-wait); }
.pill-new { padding: 3px 8px; border-radius: 6px; background: var(--hi); color: var(--hi-ink); }
.pill-new::before { display: none; }

/* Düğmeler */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); font: 600 15px/1 var(--font-body); text-decoration: none; white-space: nowrap; transition: background-color .15s, border-color .15s, color .15s, transform .1s; }
.btn:active { transform: translateY(1px); }
.btn svg { width: 18px; height: 18px; stroke-width: 2.2; flex: none; }
.btn:hover { border-color: var(--ink); }
.btn-primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn-primary:hover { border-color: var(--brand); filter: brightness(1.08); }
.btn-on { background: var(--brand-soft); border-color: var(--brand-soft); color: var(--brand); }
.btn-on:hover { border-color: var(--brand); }
.btn-ghost { background: transparent; }
.btn-ghost[aria-pressed="true"] { background: var(--surface-2); border-color: var(--surface-2); }
.btn-sm { min-height: 36px; padding: 0 12px; border-radius: 10px; font-size: 14px; }
.btn-sm svg { width: 16px; height: 16px; }
.btn-icon { width: 44px; padding: 0; }
.btn:disabled { opacity: .6; cursor: progress; }
.btn-danger { color: var(--heart); border-color: var(--heart-soft); background: transparent; }
.btn-danger:hover { border-color: var(--heart); }
.btn-danger-solid { background: var(--heart); border-color: var(--heart); color: #fff; }
.btn-danger-solid:hover { border-color: var(--heart); filter: brightness(1.08); }
.btn-light { background: var(--cover-ink); border-color: var(--cover-ink); color: var(--cover); }
.btn-light:hover { border-color: var(--cover-ink); filter: brightness(.96); }
.btn-band { background: transparent; border-color: var(--cover-muted); color: var(--cover-ink); }
.btn-band:hover { border-color: var(--cover-ink); }
.heart[aria-pressed="true"] { background: var(--heart-soft); border-color: var(--heart-soft); color: var(--heart); }
.heart[aria-pressed="true"] .i-heart { fill: var(--heart); }
.link-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; background: none; border: 0; padding: 0; font-weight: 600; color: var(--ink); text-decoration: none; }
.link-btn svg { width: 20px; height: 20px; }
.link-btn:hover span { text-decoration: underline; text-underline-offset: 3px; }

/* İşaret kutusu: ajandadaki tik kutusu */
.check { flex: none; width: 46px; height: 46px; border-radius: 14px; border: 2px solid var(--line-strong); background: var(--surface); color: var(--line-strong); display: grid; place-items: center; transition: background-color .15s, border-color .15s, color .15s, transform .15s; }
.check svg { width: 24px; height: 24px; stroke-width: 2.6; }
.check:hover { border-color: var(--brand); color: var(--brand); }
.check.is-done { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); transform: scale(1.08) rotate(-4deg); }

/* İzleme listesi */
.wlist { display: grid; gap: 10px; }
@media (min-width: 900px) { .wlist { grid-template-columns: 1fr 1fr; } }
.wrow { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px 14px 10px 10px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
.wrow-poster { display: block; }
.wrow-title { display: block; font: 700 17px/1.25 var(--font-display); letter-spacing: -.01em; text-decoration: none; }
.wrow-title:hover { text-decoration: underline; text-underline-offset: 3px; }
.wrow-ep { margin-top: 5px; font-size: 14.5px; line-height: 1.4; overflow-wrap: anywhere; }
.wrow-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin-top: 8px; font: 500 12.5px/1.2 var(--font-mono); color: var(--muted); }
.wrow-meta .bar { flex: 1 1 80px; max-width: 150px; }
.wait-icon { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
.wait-icon svg { width: 22px; height: 22px; }

/* Yaklaşanlar: ajanda sayfası, solda tarih sütunu */
.day { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; margin-top: 26px; }
@media (min-width: 760px) { .day { grid-template-columns: 84px minmax(0, 1fr); gap: 22px; } }
.day-date { position: sticky; top: 76px; align-self: start; display: grid; justify-items: center; gap: 4px; padding: 10px 2px 11px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); text-align: center; }
.day-date .dd { font: 700 26px/1 var(--font-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.day-date .mm { font: 500 11.5px/1.15 var(--font-mono); color: var(--muted); }
.day-date svg { width: 22px; height: 22px; color: var(--muted); }
@media (min-width: 760px) { .day-date .dd { font-size: 32px; } }
.day.is-today .day-date { background: var(--hi); color: var(--hi-ink); }
.day.is-today .day-date .mm { color: var(--hi-ink); }
.day-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 10px; padding: 6px 0 10px; }
.day-head h2 { margin: 0; font: 700 20px/1.2 var(--font-display); letter-spacing: -.015em; }
.day-head span { font: 500 12.5px/1.2 var(--font-mono); color: var(--muted); }
.day-list { display: grid; gap: 8px; }
.urow { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px 10px 10px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); text-decoration: none; }
.urow:hover { box-shadow: 0 0 0 1.5px var(--brand), var(--shadow); }
.urow-body { display: grid; gap: 3px; min-width: 0; }
.urow-show { font: 700 15.5px/1.25 var(--font-display); letter-spacing: -.01em; overflow-wrap: anywhere; }
.urow-ep { font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
.urow-net { font-size: 13px; color: var(--muted); }
.urow-side { display: grid; justify-items: end; gap: 5px; text-align: right; }
.urow-time { font: 500 16px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.urow-time.no-time { font-size: 12px; color: var(--muted); }
.urow-when { font: 500 12px/1.2 var(--font-mono); color: var(--muted); white-space: nowrap; }
.urow-when.is-aired { color: var(--ok); }
@media (max-width: 420px) { .urow { grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; } .poster-xs { width: 34px; } }

/* Keşfet */
.search { display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 0 16px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); box-shadow: var(--shadow); }
.search:focus-within { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
.search svg { width: 22px; height: 22px; color: var(--muted); flex: none; }
.search input { flex: 1; min-width: 0; width: 0; border: 0; background: transparent; padding: 14px 0; font-size: 18px; font-weight: 500; outline: none; }
.search input::placeholder { color: var(--muted); }
.search-inline { max-width: 560px; padding: 0 6px 0 14px; background: var(--bg); box-shadow: none; }
.search-inline input { font-size: 17px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 14px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 38px; padding: 0 16px; border-radius: 10px; border: 1.5px solid var(--line-strong); background: transparent; font-weight: 600; font-size: 14.5px; }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 24px 14px; }
@media (max-width: 400px) { .grid { grid-template-columns: 1fr 1fr; } }
.card { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card-link { display: grid; gap: 9px; text-decoration: none; }
.card-link .poster { box-shadow: var(--shadow); }
.card-title { font: 700 16px/1.25 var(--font-display); letter-spacing: -.01em; overflow-wrap: anywhere; }
.card-link:hover .card-title { text-decoration: underline; text-underline-offset: 3px; }
.card-meta { margin-top: -4px; font: 500 12px/1.4 var(--font-mono); color: var(--muted); flex: 1; }
.card .btn { width: 100%; }
.result-count { margin: 20px 0 12px; font: 500 13px/1.2 var(--font-mono); }
.slist { display: grid; gap: 10px; }
.srow { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px 12px 10px 10px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
.srow-title { font: 700 17px/1.25 var(--font-display); letter-spacing: -.01em; text-decoration: none; }
.srow-title:hover { text-decoration: underline; text-underline-offset: 3px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 4px; font-size: 14px; color: var(--muted); }
.genres { margin-top: 3px; font-size: 13.5px; color: var(--muted); }
@media (max-width: 480px) {
  .srow { grid-template-columns: 52px minmax(0, 1fr); }
  .srow > .btn { grid-column: 1 / -1; }
}

/* Dizi sayfası */
.backbar { padding-top: 12px; }
.hero { display: grid; grid-template-columns: 112px minmax(0, 1fr); grid-template-areas: "poster head" "actions actions"; gap: 16px 18px; margin-top: 6px; }
.hero > .poster { grid-area: poster; }
.hero-head { grid-area: head; align-self: center; min-width: 0; }
.hero h1 { margin: 0; font: 800 clamp(30px, 5.4vw, 52px)/1.02 var(--font-display); letter-spacing: -.03em; overflow-wrap: anywhere; }
.hero .meta { margin-top: 10px; font-size: 14.5px; }
.actions { grid-area: actions; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; align-self: start; }
.act-group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
@media (min-width: 760px) {
  .hero { grid-template-columns: 220px minmax(0, 1fr); grid-template-areas: "poster head" "poster actions"; grid-template-rows: auto 1fr; gap: 18px 32px; }
  .hero-head { align-self: end; }
}
.rating { display: inline-flex; align-items: center; gap: 4px; font: 500 13px/1 var(--font-mono); color: var(--ink); }
.rating svg { width: 15px; height: 15px; fill: var(--hi); stroke: var(--hi); }
.pcard { margin-top: 26px; padding: 18px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); display: grid; gap: 16px; }
.pc-top { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px 16px; }
.pc-top .big { font: 700 28px/1 var(--font-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.pc-top .muted { font: 500 12.5px/1.2 var(--font-mono); }
.pc-grid { display: grid; gap: 16px; }
@media (min-width: 760px) { .pc-grid { grid-template-columns: 1fr 1fr; gap: 28px; } }
.next { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.next-ep { font-weight: 600; overflow-wrap: anywhere; }
.label { margin-bottom: 7px; font: 500 12.5px/1 var(--font-mono); color: var(--muted); }
.summary-text { max-width: 68ch; font-size: 16px; line-height: 1.65; }
.season { margin-bottom: 10px; padding: 0 14px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
.season-head { display: grid; grid-template-columns: minmax(0, 1fr) 110px auto; gap: 14px; align-items: center; padding: 6px 0; }
.season-toggle { display: flex; align-items: center; gap: 10px; min-height: 48px; background: none; border: 0; padding: 0; text-align: left; }
.season-name { font: 700 18px/1.2 var(--font-display); letter-spacing: -.01em; }
.season-count { font: 500 12.5px/1 var(--font-mono); color: var(--muted); }
.chev { display: grid; place-items: center; color: var(--muted); }
.chev svg { width: 20px; height: 20px; transition: transform .18s; }
.season.is-open .chev svg { transform: rotate(90deg); }
@media (max-width: 520px) { .season-head { grid-template-columns: minmax(0, 1fr) auto; } .bar-season { display: none; } }
.eps { list-style: none; margin: 0; padding: 6px 0 10px; border-top: 1px solid var(--line); }
.ep { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; align-items: center; padding: 8px 4px; border-radius: 10px; }
.ep:hover { background: var(--bg); }
.ep-check { width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--line-strong); background: var(--surface); display: grid; place-items: center; color: transparent; transition: background-color .12s, border-color .12s, color .12s; }
.ep-check svg { width: 17px; height: 17px; stroke-width: 3; }
.ep-check:hover { border-color: var(--brand); color: var(--line-strong); }
.ep-check[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.ep-check:disabled { border-style: dashed; cursor: not-allowed; opacity: .5; }
.ep-body { display: grid; gap: 2px; min-width: 0; }
.ep-name { overflow-wrap: anywhere; line-height: 1.35; }
.ep-num { font: 500 12.5px/1 var(--font-mono); color: var(--muted); margin-right: 8px; }
.ep-date { font: 500 12px/1.3 var(--font-mono); color: var(--muted); }
.ep.is-watched .ep-name { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); text-decoration-thickness: 1.5px; }

/* Profil: kapak kartı */
.pband { margin-top: 18px; padding: 22px; border-radius: 24px; background: var(--cover); color: var(--cover-ink); }
@media (min-width: 760px) { .pband { padding: 28px; } }
.who { display: flex; align-items: center; gap: 16px; }
.who-body { min-width: 0; display: grid; gap: 2px; }
.avatar { width: 64px; height: 64px; border-radius: 20px; background: var(--cover-ink); color: var(--cover); display: grid; place-items: center; font: 800 24px/1 var(--font-display); letter-spacing: -.02em; flex: none; }
.avatar svg { width: 32px; height: 32px; }
.who h1 { margin: 0; font: 800 28px/1.1 var(--font-display); letter-spacing: -.025em; overflow-wrap: anywhere; }
.on-band { color: var(--cover-muted); min-height: 32px; }
.on-band:hover { color: var(--cover-ink); }
.name-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.name-form input { height: 40px; width: 200px; min-width: 0; border-radius: 10px; border: 1.5px solid var(--cover-muted); background: transparent; color: var(--cover-ink); padding: 0 12px; font-size: 16px; }
.name-form input::placeholder { color: var(--cover-muted); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 22px; }
@media (min-width: 760px) { .stats { grid-template-columns: 1.6fr 1fr 1fr 1fr; } }
.stat { display: flex; flex-direction: column; justify-content: space-between; background: var(--cover-tile); border-radius: 16px; padding: 14px 16px; }
.stat-time { grid-column: 1 / -1; }
@media (min-width: 760px) { .stat-time { grid-column: auto; } }
@media (max-width: 420px) { .stat { padding: 12px; } .stat:not(.stat-time) .stat-value { font-size: 26px; } }
.stat-label { font: 500 13px/1.25 var(--font-body); color: var(--cover-muted); }
.stat-value { display: block; margin-top: 10px; font: 700 30px/1 var(--font-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--cover-ink); }
.time-split { display: flex; gap: 22px; }
.unit { display: block; margin-top: 5px; font: 500 12px/1 var(--font-mono); color: var(--cover-muted); }
.shelf { display: grid; grid-auto-flow: column; grid-auto-columns: 116px; gap: 14px; overflow-x: auto; padding: 2px 2px 12px; scroll-snap-type: x proximity; align-items: start; }
@media (min-width: 760px) { .shelf { grid-auto-columns: 138px; } }
.tile { display: grid; gap: 7px; text-decoration: none; scroll-snap-align: start; }
.tile-poster { position: relative; }
.tile-poster .poster { box-shadow: var(--shadow); }
.tile-badge { position: absolute; top: 6px; right: 6px; z-index: 2; width: 26px; height: 26px; border-radius: 9px; display: grid; place-items: center; background: var(--surface); box-shadow: 0 1px 4px rgba(0, 0, 0, .25); }
.tile-badge svg { width: 15px; height: 15px; stroke-width: 3; }
.tile-badge.done { background: var(--brand); color: var(--brand-ink); }
.tile-badge.fav { color: var(--heart); }
.tile-badge.fav svg { fill: var(--heart); stroke-width: 2; }
.tile-name { font-weight: 600; font-size: 14.5px; line-height: 1.3; overflow-wrap: anywhere; }
.tile:hover .tile-name { text-decoration: underline; text-underline-offset: 3px; }
.tile-meta { margin-top: -3px; font: 500 12px/1.2 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.hist a { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px 10px 10px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); text-decoration: none; }
.hist a:hover { box-shadow: 0 0 0 1.5px var(--brand), var(--shadow); }
.hist-body { display: grid; gap: 3px; min-width: 0; }
.hist-show { font: 700 15.5px/1.25 var(--font-display); letter-spacing: -.01em; }
.hist-ep { font-size: 14px; overflow-wrap: anywhere; }
.hist-when { font: 500 12px/1.2 var(--font-mono); color: var(--muted); white-space: nowrap; }
.gbars { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; max-width: 640px; }
.gbars li { display: grid; grid-template-columns: 104px minmax(0, 1fr) 86px; gap: 12px; align-items: center; font-size: 14.5px; font-weight: 600; }
.g-bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.g-bar span { display: block; height: 100%; border-radius: inherit; background: var(--hi); }
.g-n { font: 500 12.5px/1 var(--font-mono); color: var(--muted); text-align: right; font-weight: 500; }
.databox { padding: 18px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); display: grid; gap: 14px; }
.databox p { max-width: 70ch; color: var(--muted); }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.warn { color: var(--err-ink); background: var(--err-bg); padding: 10px 12px; border-radius: 10px; }

/* Başlangıç, boş durumlar, yükleniyor */
.intro { margin-top: 22px; padding: 24px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
@media (max-width: 400px) { .intro { padding: 20px 16px; } }
.intro h1 { margin: 0; font: 800 clamp(28px, 5vw, 40px)/1.05 var(--font-display); letter-spacing: -.03em; }
.intro h1 em { font-style: normal; color: var(--brand); }
.intro p { max-width: 62ch; color: var(--muted); }
.empty { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 32px 20px; border-radius: var(--radius); border: 1.5px dashed var(--line-strong); color: var(--muted); }
.empty-title { color: var(--ink); font: 700 17px/1.3 var(--font-display); letter-spacing: -.01em; }
.empty p:not(.empty-title) { max-width: 48ch; }
.empty .btn { margin-top: 6px; }
.center { display: grid; place-items: center; padding: 40px 0; }
.center.tall { min-height: 50vh; }
.spinner { width: 36px; height: 36px; border-radius: 50%; border: 4px solid var(--surface-2); border-top-color: var(--brand); animation: spin .75s linear infinite; }
.spin-sm { width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid transparent; border-top-color: currentColor; border-right-color: currentColor; animation: spin .75s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.foot { margin-top: 48px; padding: 18px 0 8px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }

/* Bildirimler ve pencere */
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 50; display: grid; gap: 8px; width: min(560px, calc(100% - 24px)); pointer-events: none; }
@media (min-width: 760px) { .toasts { bottom: 24px; } }
.toast { pointer-events: auto; display: grid; gap: 6px; padding: 14px 16px 10px; border-radius: 14px; background: var(--toast-bg); color: var(--toast-ink); box-shadow: 0 14px 34px rgba(22, 23, 44, .28); animation: toast-in .18s ease-out; }
.toast p { font-size: 15px; padding-bottom: 4px; }
.toast.out { opacity: 0; transform: translateY(6px); transition: opacity .18s, transform .18s; }
.toast-error { background: var(--err-bg); color: var(--err-ink); }
.toast-actions { display: flex; justify-content: flex-end; gap: 14px; }
.toast-actions button { background: none; border: 0; min-height: 36px; padding: 0 4px; font: 600 15px/1 var(--font-body); color: var(--toast-act); }
.toast-error .toast-actions button { color: var(--err-ink); text-decoration: underline; text-underline-offset: 3px; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }
.dialog-backdrop { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(13, 14, 25, .52); }
.dialog-backdrop[hidden] { display: none; }
.dialog { width: 100%; max-width: 460px; padding: 22px; border-radius: 20px; background: var(--surface); color: var(--ink); box-shadow: 0 20px 50px rgba(0, 0, 0, .3); display: grid; gap: 12px; }
.dialog h2 { margin: 0; font: 700 21px/1.2 var(--font-display); letter-spacing: -.015em; }
.dialog p { color: var(--muted); }
.dialog textarea { width: 100%; min-height: 120px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); font: 13px/1.4 var(--font-mono); resize: vertical; }
.dialog textarea:focus { border-color: var(--brand); outline: none; }
.dlg-err { color: var(--heart) !important; font-weight: 600; }
.dialog-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-top: 6px; }

/* Üst çubuk: ayarlar */
.gear { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); flex: none; }
.gear:hover { color: var(--ink); border-color: var(--line-strong); }
.gear[aria-current="page"] { color: var(--brand); border-color: var(--brand-soft); background: var(--brand-soft); }
.gear svg { width: 17px; height: 17px; }

/* Dizi sayfası: dış puanlar */
.hero { grid-template-areas: "poster head" "actions actions" "scores scores"; }
@media (min-width: 760px) { .hero { grid-template-areas: "poster head" "poster actions" "poster scores"; grid-template-rows: auto auto 1fr; } }
.scores { grid-area: scores; display: flex; flex-wrap: wrap; gap: 8px; align-self: start; min-width: 0; }
.score { display: grid; gap: 4px; min-width: 104px; padding: 10px 12px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); text-decoration: none; }
a.score:hover { box-shadow: 0 0 0 1.5px var(--brand), var(--shadow); }
.score-src { font: 500 12px/1.2 var(--font-mono); color: var(--muted); }
.score-val { font: 700 23px/1 var(--font-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.score-val small { margin-left: 2px; font: 500 12px/1 var(--font-mono); color: var(--muted); letter-spacing: 0; }
.score-sub { font: 500 11.5px/1.2 var(--font-mono); color: var(--muted); }
.scores-note { flex-basis: 100%; font: 500 12px/1.3 var(--font-mono); color: var(--muted); }
.hint { margin-top: 18px; font-size: 14.5px; color: var(--muted); }
.hint a, .prov-note a, .rate-note a { color: var(--brand); font-weight: 600; text-underline-offset: 3px; }

/* Nerede izlenir */
.prov { padding: 16px 18px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); display: grid; gap: 14px; }
.prov-groups { display: grid; gap: 14px; }
@media (min-width: 760px) { .prov-groups { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); } }
.prov-group { display: grid; gap: 8px; align-content: start; }
.prov-list { display: flex; flex-wrap: wrap; gap: 8px; }
.prov-item { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 12px; background: var(--bg); font-weight: 600; font-size: 14px; }
.prov-item img, .prov-logo { width: 32px; height: 32px; border-radius: 8px; flex: none; background: var(--surface-2); }
.prov-note { font-size: 13px; color: var(--muted); }

/* Puan verme */
.rate { padding: 16px 18px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); display: grid; gap: 14px; }
.rate-scale { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; max-width: 520px; }
.rate-btn { min-width: 0; height: 42px; padding: 0; border-radius: 10px; border: 1.5px solid var(--line-strong); background: var(--surface); font: 500 15px/1 var(--font-mono); color: var(--muted); transition: background-color .12s, border-color .12s, color .12s; }
.rate-btn:hover { border-color: var(--brand); color: var(--brand); }
.rate-btn.on { background: var(--brand-soft); border-color: var(--brand-soft); color: var(--brand); }
.rate-btn[aria-checked="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.rate-meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; font-size: 14px; color: var(--muted); }
.rate-avg { font: 700 28px/1 var(--font-display); letter-spacing: -.02em; color: var(--ink); font-variant-numeric: tabular-nums; }
.rate-note { font-size: 13.5px; color: var(--muted); }
.friends { display: flex; flex-wrap: wrap; gap: 6px; }
.friend { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px 4px 4px; border-radius: 99px; background: var(--bg); font-size: 13.5px; font-weight: 600; }
.friend b { font: 500 12.5px/1 var(--font-mono); color: var(--brand); }
.mini-av { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; background: hsl(var(--h) 58% 82%); color: #16172c; font: 800 10.5px/1 var(--font-display); flex: none; }

/* Yorumlar */
.composer { display: grid; gap: 10px; margin-bottom: 14px; padding: 12px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
.composer textarea { width: 100%; min-height: 84px; resize: vertical; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); font-size: 15.5px; line-height: 1.45; }
.composer textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.composer-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.composer-as { margin-left: auto; font: 500 12.5px/1.2 var(--font-mono); color: var(--muted); }
.check-row { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
.check-row input { width: 18px; height: 18px; accent-color: var(--brand); flex: none; }
.cmts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.cmt { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; padding: 12px 14px 10px 12px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
.cmt-av { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: hsl(var(--h) 58% 82%); color: #16172c; font: 800 13px/1 var(--font-display); }
.cmt-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.cmt-head strong { font: 700 15px/1.25 var(--font-display); letter-spacing: -.01em; }
.cmt-head time, .cmt-you { font: 500 12px/1 var(--font-mono); color: var(--muted); }
.cmt-you { color: var(--brand); }
.cmt-text { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
.cmt-del { min-height: 30px; margin-top: 2px; font-size: 13px; color: var(--muted); }
.spoiler-cover { width: 100%; margin-top: 6px; padding: 12px; border-radius: 10px; border: 1.5px dashed var(--line-strong); background: var(--bg); color: var(--muted); font-weight: 600; font-size: 14px; text-align: left; }
.spoiler-cover:hover { border-color: var(--brand); color: var(--ink); }
.guard { display: grid; justify-items: start; gap: 10px; padding: 16px; border-radius: var(--radius); background: var(--hi-soft); color: var(--ink); }
.ep { grid-template-columns: 32px minmax(0, 1fr) auto; }
a.ep-body { text-decoration: none; }
a.ep-body:hover .ep-name { text-decoration: underline; text-underline-offset: 3px; }
.ep-cc { display: inline-flex; align-items: center; gap: 4px; font: 500 12px/1 var(--font-mono); color: var(--muted); }
.ep-cc svg { width: 15px; height: 15px; }

/* Bölüm sayfası */
.ep-hero { display: grid; gap: 14px; margin-top: 6px; max-width: 760px; }
.ep-show { display: inline-flex; align-items: center; gap: 10px; justify-self: start; text-decoration: none; font: 700 15px/1.2 var(--font-display); color: var(--muted); }
.ep-show:hover { color: var(--ink); }
.ep-hero h1 { margin: 0; font: 800 clamp(28px, 5vw, 44px)/1.05 var(--font-display); letter-spacing: -.03em; overflow-wrap: anywhere; }
.ep-still { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 16px; box-shadow: var(--shadow); background: var(--surface-2); }
.ep-nav { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }

/* Trend */
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 14px; }
@media (max-width: 400px) { .tgrid { grid-template-columns: 1fr 1fr; } }
.tcard { position: relative; display: grid; gap: 8px; align-content: start; min-width: 0; padding: 0; border: 0; background: none; color: inherit; text-align: left; }
.tcard .poster { box-shadow: var(--shadow); }
.tcard:hover .card-title { text-decoration: underline; text-underline-offset: 3px; }
.tcard.is-busy { opacity: .55; cursor: progress; }
.tcard-rank { position: absolute; top: 8px; left: 8px; z-index: 2; min-width: 30px; height: 30px; padding: 0 8px; border-radius: 10px; display: grid; place-items: center; background: var(--ink); color: var(--bg); font: 500 13px/1 var(--font-mono); }
.tcard-badge { position: absolute; top: 8px; right: 8px; z-index: 2; height: 26px; padding: 0 8px; border-radius: 9px; display: inline-flex; align-items: center; background: var(--brand); color: var(--brand-ink); font: 500 11.5px/1 var(--font-mono); }

/* Ayarlar */
.narrow { max-width: 760px; }
.set-card { margin-top: 16px; padding: 18px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); display: grid; gap: 12px; }
.set-card h2 { margin: 0; font: 700 20px/1.2 var(--font-display); letter-spacing: -.015em; }
.set-card > p { color: var(--muted); }
.set-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.set-form { display: grid; gap: 8px; }
.set-form label:not(.check-row) { font-weight: 600; font-size: 14px; }

const abortErr = () => new DOMException('İptal edildi', 'AbortError');
const net = {
  q: [], active: 0, last: 0, timer: 0,
  get(path, { priority = false, signal } = {}) {
    return new Promise((resolve, reject) => {
      const job = { path, resolve, reject, signal, tries: 0 };
      if (priority) this.q.unshift(job); else this.q.push(job);
      this.pump();
    });
  },
  pump() {
    while (this.active < 2 && this.q.length) {
      const wait = this.last + 520 - Date.now();
      if (wait > 0) { clearTimeout(this.timer); this.timer = setTimeout(() => this.pump(), wait); return; }
      const job = this.q.shift();
      if (job.signal && job.signal.aborted) { job.reject(abortErr()); continue; }
      this.active++; this.last = Date.now();
      this.run(job).finally(() => { this.active--; this.pump(); });
    }
  },
  async run(job) {
    for (;;) {
      const ctrl = new AbortController();
      const kill = () => ctrl.abort();
      const timer = setTimeout(kill, 15000);
      if (job.signal) job.signal.addEventListener('abort', kill);
      try {
        const res = await fetch(API + job.path, { signal: ctrl.signal });
        if (res.status === 429 && job.tries < 4) { job.tries++; await sleep(1200 * job.tries); continue; }
        if (!res.ok) { const err = new Error('HTTP ' + res.status); err.status = res.status; throw err; }
        job.resolve(await res.json());
        return;
      } catch (err) {
        job.reject(job.signal && job.signal.aborted ? abortErr() : err);
        return;
      } finally {
        clearTimeout(timer);
        if (job.signal) job.signal.removeEventListener('abort', kill);
      }
    }
  },
};

function stats(s, now = Date.now()) {
  const eps = s.eps || [];
  const W = D.watched;
  let aired = 0, watchedAired = 0, watchedCount = 0, lastIdx = -1, lastAt = 0, minutes = 0, tba = 0;
  const upcoming = [];
  for (let i = 0; i < eps.length; i++) {
    const e = eps[i], w = W[e[E_ID]], air = e[E_AIR];
    const on = air != null && air <= now;
    if (w) { watchedCount++; lastIdx = i; if (w[1] > lastAt) lastAt = w[1]; minutes += e[E_RT] || s.rt || 40; }
    if (on) { aired++; if (w) watchedAired++; }
    else if (air != null) upcoming.push(e);
    else tba++;
  }
  // Sıradaki: en son izlenen bölümden sonraki ilk yayınlanmış bölüm
  let next = null, remaining = 0;
  for (let i = lastIdx + 1; i < eps.length; i++) {
    const e = eps[i];
    if (e[E_AIR] != null && e[E_AIR] <= now && !W[e[E_ID]]) { if (!next) next = e; remaining++; }
  }
  upcoming.sort((a, b) => a[E_AIR] - b[E_AIR]);
  const ended = s.status === 'Ended';
  let state;
  if (s.stopped) state = 'stopped';
  else if (next) state = watchedCount ? 'watching' : 'notstarted';
  else if (!aired) state = 'premiere';
  else if (ended && watchedCount) state = 'finished';
  else state = 'caughtup';
  return { aired, watchedAired, watchedCount, next, remaining, nextAir: upcoming[0] || null, upcoming, tba, lastAt, minutes, ended, state, total: eps.length };
}

function toast({ text, kind = 'info', actions = [], timeout = 5500 }) {
  const box = $('#toasts');
  const el = document.createElement('div');
  el.className = `toast toast-${kind}`;
  el.setAttribute('role', kind === 'error' ? 'alert' : 'status');
  const p = document.createElement('p');
  p.textContent = text;
  el.append(p);
  let timer = 0, hardStop = 0;
  const close = () => {
    clearTimeout(timer); clearTimeout(hardStop);
    if (!el.isConnected) return;
    el.classList.add('out');
    setTimeout(() => el.remove(), reducedMotion() ? 0 : 180);
  };
  if (actions.length) {
    const row = document.createElement('div');
    row.className = 'toast-actions';
    for (const a of actions) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = a.label;
      b.addEventListener('click', () => { close(); if (a.fn) a.fn(); });
      row.append(b);
    }
    el.append(row);
  }
  timer = setTimeout(close, timeout);
  hardStop = setTimeout(close, Math.max(timeout * 3, 15000));   // üstünde beklense de sonunda kapanır
  el.addEventListener('pointerenter', () => clearTimeout(timer));
  el.addEventListener('pointerleave', () => { clearTimeout(timer); timer = setTimeout(close, 2500); });
  // Aynı türden en fazla bir bildirim: yenisi eskisinin yerini alır (ekranı kapatmasın)
  for (const old of $$(`.toast-${kind}`, box)) old.remove();
  box.append(el);
  return close;
}
function netError(retry, text = 'Bir ağ hatası oluştu.') {
  toast({ kind: 'error', text, timeout: 9000, actions: [{ label: 'Kapat' }].concat(retry ? [{ label: 'Yenile', fn: retry }] : []) });
}

function dialog({ title, text = '', html = '', ok = 'Tamam', cancel = 'Vazgeç', danger = false, onOk, onOpen }) {
  return new Promise(resolve => {
    const back = $('#dialog');
    const prevFocus = document.activeElement;
    back.innerHTML = `<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <h2 id="dlg-title">${esc(title)}</h2>${text ? `<p>${esc(text)}</p>` : ''}${html}
      <div class="dialog-actions">${cancel ? `<button type="button" class="btn btn-ghost" data-dlg="cancel">${esc(cancel)}</button>` : ''}<button type="button" class="btn ${danger ? 'btn-danger-solid' : 'btn-primary'}" data-dlg="ok">${esc(ok)}</button></div></div>`;
    back.hidden = false;
    const close = val => {
      back.hidden = true; back.innerHTML = ''; back.onclick = null;
      document.removeEventListener('keydown', onKey, true);
      if (prevFocus && prevFocus.isConnected) prevFocus.focus({ preventScroll: true });
      resolve(val);
    };
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); close(false); return; }
      if (e.key !== 'Tab') return;
      const f = $$('button, [href], input, textarea', back).filter(x => !x.disabled);
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    };
    document.addEventListener('keydown', onKey, true);
    back.onclick = e => {
      if (e.target === back) { close(false); return; }
      const b = e.target.closest('[data-dlg]');
      if (!b) return;
      if (b.dataset.dlg === 'cancel') { close(false); return; }
      const v = onOk ? onOk(back) : true;
      if (v === false) return;
      close(v);
    };
    (back.querySelector('textarea, input') || back.querySelector('[data-dlg="ok"]')).focus();
    if (onOpen) onOpen(back);
  });
}

function poster(s, cls = '', large = false) {
  const src = large ? (s.imgL || s.img) : s.img;
  return `<div class="poster ${cls}" style="--h:${hue(s.name)}"><span class="poster-fb" aria-hidden="true">${esc(initials(s.name))}</span>${src ? `<img src="${esc(src)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : ''}</div>`;
}
function statusPill(status) {
  const m = STATUS[status];
  return m ? `<span class="pill pill-${m[1]}">${m[0]}</span>` : '';
}
function yearRange(s) {
  const a = (s.prem || '').slice(0, 4);
  if (!a) return '';
  const b = (s.ended || '').slice(0, 4);
  if (s.status === 'Ended') return b && b !== a ? `${a}–${b}` : a;
  return `${a}–`;
}
const genreText = (s, max = 3) => (s.genres || []).slice(0, max).map(g => GENRES[g] || g).join(' · ');
const section = (title, count, body, icon = '') => `<section class="sec"><div class="sec-head">${icon}<h2>${esc(title)}</h2>${count ? `<span class="count">${count}</span>` : ''}</div>${body}</section>`;
const spinner = (label = 'Yükleniyor') => `<div class="spinner" role="status" aria-label="${esc(label)}"></div>`;
const emptyCard = (title, text, href, label) => `<div class="empty"><p class="empty-title">${esc(title)}</p>${text ? `<p>${esc(text)}</p>` : ''}${href ? `<a class="btn" href="${href}">${esc(label)}</a>` : ''}</div>`;
const errorCard = (text, act, id) => `<div class="empty"><p class="empty-title">${esc(text)}</p><p>İnternet bağlantını kontrol edip tekrar dene.</p><button type="button" class="btn" data-act="${act}"${id ? ` data-id="${id}"` : ''}>${ICON.refresh}<span>Tekrar yükle</span></button></div>`;
const footer = () => `<footer class="foot">Dizi bilgileri ve afişler <a href="https://www.tvmaze.com" target="_blank" rel="noopener">TVmaze</a> kaynaklıdır (CC BY-SA). Trend listesi, öneriler, oyuncu ve ekip bilgileri <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a>'den, izleme platformları TMDB üzerinden JustWatch'tan, IMDb, Rotten Tomatoes, Metacritic ve Letterboxd puanları <a href="https://mdblist.com" target="_blank" rel="noopener">MDBList</a>'ten gelir. Şarkı listeleri için <a href="https://www.tunefind.com" target="_blank" rel="noopener">Tunefind</a>'a bağlantı verilir. Bu ürün TMDB API'sini kullanır ancak TMDB tarafından onaylanmamıştır. Saatler cihazının saat dilimine göre gösterilir.</footer>`;

function followBtn(s, small = false) {
  const sm = small ? ' btn-sm' : '';
  return D.shows[s.id]
    ? `<button type="button" class="btn btn-on${sm}" data-act="unfollow" data-id="${s.id}" data-focus="fol-${s.id}" aria-label="${esc(s.name)} takip ediliyor. Takipten çıkmak için dokun.">${ICON.check}<span>Takiptesin</span></button>`
    : `<button type="button" class="btn btn-primary${sm}" data-act="follow" data-id="${s.id}" data-focus="fol-${s.id}" aria-label="${esc(s.name)} dizisini takip et">${ICON.plus}<span>Takip et</span></button>`;
}
function subtabs(active) {
  return `<nav class="subtabs" aria-label="Diziler"><div class="wrap"><div class="seg">
    <a href="#diziler"${active === 'watchlist' ? ' aria-current="page"' : ''}>İzleme listesi</a>
    <a href="#yaklasanlar"${active === 'upcoming' ? ' aria-current="page"' : ''}>Yaklaşanlar</a>
  </div></div></nav>`;
}

/* ================= İzleme listesi ================= */
function watchRow(s, st, now) {
  const e = st.next;
  const pct = st.aired ? Math.round(st.watchedAired / st.aired * 100) : 0;
  const isNew = e[E_AIR] >= now - NEW_WINDOW;
  return `<article class="wrow">
    <a class="wrow-poster" href="#dizi-${s.id}" tabindex="-1" aria-hidden="true">${poster(s, 'poster-sm')}</a>
    <div>
      <a class="wrow-title" href="#dizi-${s.id}">${showTitleHtml(s)}</a>
      <div class="wrow-ep"><span class="epcode">${epLabel(s, e)}</span>${esc(e[E_NAME] || `Bölüm ${e[E_N]}`)}${resumeTag(e[E_ID])}</div>
      <div class="wrow-meta">
        <div class="bar" role="progressbar" aria-label="İzleme ilerlemesi" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span style="width:${pct}%"></span></div>
        <span>${nf.format(st.remaining)} bölüm kaldı</span>
        ${isNew ? '<span class="pill pill-new">Yeni</span>' : ''}
        ${catchTag(s, st, now)}
      </div>
    </div>
    <button type="button" class="check" data-act="watch-next" data-id="${s.id}" data-ep="${e[E_ID]}" data-focus="wn-${s.id}" aria-label="${esc(s.name)} ${epLabel(s, e)} izlendi olarak işaretle">${ICON.check}</button>
  </article>`;
}
function waitRow(s, st, now) {
  const na = st.nextAir;
  let when;
  if (na) when = `<span class="epcode">${epLabel(s, na)}</span>${esc(airText(na, now))} · <strong>${esc(relTime(na[E_AIR], now, na[E_TIME]))}</strong>`;
  else if (st.tba) when = 'Yeni bölüm duyuruldu, tarihi açıklanmadı.';
  else when = 'Yeni bölüm tarihi henüz açıklanmadı.';
  return `<article class="wrow">
    <a class="wrow-poster" href="#dizi-${s.id}" tabindex="-1" aria-hidden="true">${poster(s, 'poster-sm')}</a>
    <div>
      <a class="wrow-title" href="#dizi-${s.id}">${showTitleHtml(s)}</a>
      <div class="wrow-ep">${when}</div>
      <div class="wrow-meta"><span>${st.state === 'premiere' ? 'Henüz yayınlanmadı' : 'Güncelsin, tüm bölümleri izledin'}</span></div>
    </div>
    <span class="wait-icon" aria-hidden="true">${ICON.cal}</span>
  </article>`;
}

function viewWatchlist() {
  const now = Date.now();
  const all = Object.values(D.shows);
  let html = subtabs('watchlist') + '<div class="wrap">';
  if (!all.length) {
    html += `<section class="intro">
      <h1>Dizi takibine <em>başla</em></h1>
      <p>Takip ettiğin her dizinin sıradaki bölümü burada durur; izleyince tek dokunuşla işaretlersin. Yeni bölüm tarihleri Yaklaşanlar sekmesinde gün gün sıralanır.</p>
      <form class="search search-inline" data-form="go-search" role="search">${ICON.search}<input name="q" type="search" placeholder="Dizi ara, ör. The Bear" aria-label="Dizi ara" autocomplete="off" enterkeyhint="search"><button type="submit" class="btn btn-primary btn-sm">Ara</button></form>
    </section>`;
    return html + schedSection() + footer() + '</div>';
  }
  const g = { watching: [], notstarted: [], waiting: [] };
  for (const s of all) {
    const st = stats(s, now);
    if (st.state === 'watching') g.watching.push([s, st]);
    else if (st.state === 'notstarted') g.notstarted.push([s, st]);
    else if (st.state === 'caughtup' || st.state === 'premiere') g.waiting.push([s, st]);
  }
  g.watching.sort((a, b) => b[1].lastAt - a[1].lastAt);
  g.notstarted.sort((a, b) => (b[0].addedAt || 0) - (a[0].addedAt || 0));
  g.waiting.sort((a, b) => (a[1].nextAir ? a[1].nextAir[E_AIR] : Infinity) - (b[1].nextAir ? b[1].nextAir[E_AIR] : Infinity));

  const toWatch = g.watching.concat(g.notstarted);
  const pending = toWatch.reduce((n, x) => n + x[1].remaining, 0);
  let week = 0;
  for (const s of all) if (!s.stopped) for (const e of s.eps || []) if (e[E_AIR] > now && e[E_AIR] - now < 7 * DAY) week++;
  html += `<div class="summary">
    <p class="date">${esc(fmtToday.format(now))}</p>
    <p class="lead">${pending ? `${toWatch.length} dizide <em>${nf.format(pending)} bölüm</em> seni bekliyor.` : 'Bekleyen bölümün yok, <em>her şeye yetiştin.</em>'}</p>
    <p class="sub">Önümüzdeki 7 günde ${week ? `<a href="#yaklasanlar">${week} yeni bölüm</a> yayınlanacak.` : 'takip ettiğin dizilerde yeni bölüm görünmüyor.'}</p>
  </div>`;
  if (g.watching.length) html += section('İzlemeye devam et', g.watching.length, `<div class="wlist">${g.watching.map(x => watchRow(x[0], x[1], now)).join('')}</div>`);
  if (g.notstarted.length) html += section('Henüz başlamadıkların', g.notstarted.length, `<div class="wlist">${g.notstarted.map(x => watchRow(x[0], x[1], now)).join('')}</div>`);
  if (g.waiting.length) html += section('Yeni bölüm bekleyenler', g.waiting.length, `<div class="wlist">${g.waiting.map(x => waitRow(x[0], x[1], now)).join('')}</div>`);
  if (!toWatch.length && !g.waiting.length) html += `<div class="sec">${emptyCard('İzleme listende bekleyen dizi yok.', 'Takip ettiğin dizileri bitirmiş ya da bırakmışsın. Bitirdiklerin Profil sayfanda duruyor.', '#kesfet', 'Yeni dizi bul')}</div>`;
  if (all.length < 4) html += schedSection('Takip edecek yeni dizi bul');
  return html + footer() + '</div>';
}

/* ================= Yaklaşanlar ================= */
function dayHeading(ms, now) {
  const dd = dayDiff(ms, now);
  const wd = fmtWeekday.format(ms);
  if (dd === 0) return ['Bugün', wd];
  if (dd === 1) return ['Yarın', wd];
  return [wd, relTime(ms, now, false)];
}
function dayDate(ms, now) {
  const d = new Date(ms);
  const month = fmtMonth.format(ms).replace('.', '');
  return `<div class="day-date" aria-hidden="true"><span class="dd">${d.getDate()}</span><span class="mm">${esc(month)}${sameYear(ms, now) ? '' : ` ${d.getFullYear()}`}</span></div>`;
}
// mode: 'day' → gün grubunun içinde (göreli zaman yalnızca bugün için), 'later' → tarihi de yaz
function upRow(s, e, now, mode = 'day') {
  const aired = e[E_AIR] <= now;
  let when = '';
  if (aired) when = '<span class="urow-when is-aired">yayınlandı</span>';
  else if (mode === 'later') when = `<span class="urow-when">${esc(shortDate(e[E_AIR], now))}</span>`;
  else if (e[E_TIME] && dayDiff(e[E_AIR], now) === 0) when = `<span class="urow-when">${esc(relTime(e[E_AIR], now, true))}</span>`;
  return `<a class="urow" href="#dizi-${s.id}">
    ${poster(s, 'poster-xs')}
    <span class="urow-body">
      <span class="urow-show">${showTitleHtml(s)}</span>
      <span class="urow-ep"><span class="epcode">${epLabel(s, e)}</span>${esc(e[E_NAME] || 'Bölüm adı açıklanmadı')}</span>
      ${s.net ? `<span class="urow-net">${esc(s.net)}</span>` : ''}
    </span>
    <span class="urow-side">${e[E_TIME] ? `<span class="urow-time">${fmtTime.format(e[E_AIR])}</span>` : '<span class="urow-time no-time">gün içinde</span>'}${when}</span>
  </a>`;
}
function viewUpcoming() {
  const now = Date.now(), today0 = startOfDay(now);
  const items = [], later = [], tba = [];
  for (const s of Object.values(D.shows)) {
    if (s.stopped) continue;
    const eps = s.eps || [];
    const fut = eps.filter(e => e[E_AIR] != null && e[E_AIR] >= today0).sort((a, b) => a[E_AIR] - b[E_AIR]);
    const near = fut.filter(e => dayDiff(e[E_AIR], now) <= 30);
    near.forEach(e => items.push([s, e]));
    if (!near.length) {
      if (fut.length) later.push([s, fut[0]]);
      else if (s.status !== 'Ended') tba.push(s);
    }
  }
  items.sort((a, b) => a[1][E_AIR] - b[1][E_AIR] || a[0].name.localeCompare(b[0].name, 'tr'));
  later.sort((a, b) => a[1][E_AIR] - b[1][E_AIR]);
  let html = subtabs('upcoming') + '<div class="wrap">';
  if (!Object.keys(D.shows).length) {
    return html + `<div class="sec">${emptyCard('Henüz takip ettiğin dizi yok.', 'Dizi ekleyince yeni bölümlerin yayın günü ve saati burada sıralanır.', '#kesfet', 'Dizi bul')}</div>` + footer() + '</div>';
  }
  const weekCount = items.filter(x => x[1][E_AIR] > now && x[1][E_AIR] - now < 7 * DAY).length;
  const monthCount = items.filter(x => x[1][E_AIR] > now).length;
  html += `<div class="summary">
    <p class="date">${esc(fmtToday.format(now))}</p>
    <p class="lead">${weekCount ? `Önümüzdeki 7 günde <em>${weekCount} bölüm</em> yayınlanacak.` : 'Önümüzdeki 7 günde <em>yeni bölüm yok.</em>'}</p>
    <p class="sub">30 gün içinde toplam ${monthCount} bölüm. Saatler cihazının saat dilimine göre.</p>
  </div>`;
  if (!items.length && !later.length && !tba.length) {
    html += `<div class="sec">${emptyCard('Tarihi belli yeni bölüm yok.', 'Takip ettiğin dizilerin yeni bölüm tarihleri açıklanınca burada gün gün listelenir.')}</div>`;
  }
  const block = (cls, dateCol, title, sub, rows) => `<section class="day${cls}">${dateCol}<div class="day-main"><header class="day-head"><h2>${esc(title)}</h2><span>${esc(sub)}</span></header><div class="day-list">${rows}</div></div></section>`;
  let curKey = null, rows = '', head = null;
  const flush = () => { if (head) html += block(head.cls, head.date, head.title, head.sub, rows); rows = ''; head = null; };
  for (const [s, e] of items) {
    const key = startOfDay(e[E_AIR]);
    if (key !== curKey) {
      flush();
      curKey = key;
      const [title, sub] = dayHeading(e[E_AIR], now);
      head = { cls: key === today0 ? ' is-today' : '', date: dayDate(e[E_AIR], now), title, sub };
    }
    rows += upRow(s, e, now);
  }
  flush();
  if (later.length) {
    html += block('', '<div class="day-date" aria-hidden="true"><span class="dd">30+</span><span class="mm">gün</span></div>', 'Daha ileri', '30 günden sonra', later.map(x => upRow(x[0], x[1], now, 'later')).join(''));
  }
  if (tba.length) {
    const tbaRows = tba.map(s => `<a class="urow" href="#dizi-${s.id}">${poster(s, 'poster-xs')}<span class="urow-body"><span class="urow-show">${showTitleHtml(s)}</span>${s.net ? `<span class="urow-net">${esc(s.net)}</span>` : ''}</span><span class="urow-side"><span class="urow-when">${esc((STATUS[s.status] || [s.status || ''])[0])}</span></span></a>`).join('');
    html += block('', `<div class="day-date" aria-hidden="true">${ICON.cal}<span class="mm">tarih yok</span></div>`, 'Tarihi açıklanmadı', 'yeni bölüm tarihi belli olmayan diziler', tbaRows);
  }
  return html + footer() + '</div>';
}

/* ================= Keşfet ================= */
function card(s) {
  const t = s.today;
  let when = '';
  if (t) when = `${t.s != null && t.n != null ? epCode(t.s, t.n) + ' · ' : ''}${t.air && t.t ? fmtTime.format(t.air) : 'bugün'}`;
  return `<article class="card">
    <a class="card-link" href="#dizi-${s.id}">${poster(s)}<span class="card-title">${showTitleHtml(s)}</span></a>
    <span class="card-meta">${esc([s.net, when].filter(Boolean).join(' · '))}</span>
    ${followBtn(s, true)}
  </article>`;
}
function schedSection(title = 'Bugün yeni bölümü çıkanlar') {
  const r = ui.region, data = ui.sched[r];
  let body;
  if (!data || data.loading) body = `<div class="center" data-need-sched="${r}">${spinner('Yayın akışı yükleniyor')}</div>`;
  else if (data.error) body = errorCard('Yayın akışı yüklenemedi.', 'retry-sched');
  else if (!data.items.length) body = emptyCard('Bu bölgede bugün yayın bulunamadı.', 'Başka bir bölge seç ya da yukarıdan ara.');
  else body = `<div class="grid">${data.items.map(card).join('')}</div>`;
  return `<section class="sec">
    <div class="sec-head"><h2>${esc(title)}</h2></div>
    <div class="chips" role="group" aria-label="Bölge">${REGIONS.map(x => `<button type="button" class="chip" data-act="region" data-region="${x.key}" aria-pressed="${x.key === r}">${x.label}</button>`).join('')}</div>
    ${body}
  </section>`;
}
function resultRow(s) {
  const meta = [yearRange(s), s.net].filter(Boolean).map(esc).join(' · ');
  return `<article class="srow">
    <a href="#dizi-${s.id}" tabindex="-1" aria-hidden="true">${poster(s, 'poster-sm')}</a>
    <div>
      <a class="srow-title" href="#dizi-${s.id}">${showTitleHtml(s)}</a>
      <div class="meta">${meta ? `<span>${meta}</span>` : ''}${statusPill(s.status)}</div>
      ${s.genres.length ? `<div class="genres">${esc(genreText(s))}</div>` : ''}
    </div>
    ${followBtn(s, true)}
  </article>`;
}
function discoverResults() {
  const q = ui.q.trim();
  if (q.length < 2) return forYouSection() + trendSection() + schedSection();
  const S = ui.search;
  if (S.q !== q || S.loading) return `<div class="center">${spinner('Aranıyor')}</div>`;
  if (S.error) return `<div class="sec">${errorCard('Arama yapılamadı.', 'retry-search')}</div>`;
  if (!S.items || !S.items.length) return `<div class="sec">${emptyCard(`“${q}” için sonuç yok.`, 'Dizinin orijinal adıyla aramayı dene; örneğin “Kızılcık Şerbeti” ya da “The Last of Us”.')}</div>`;
  return `<p class="result-count muted">“${esc(q)}” için ${S.items.length} sonuç</p><div class="slist">${S.items.map(resultRow).join('')}</div>`;
}
function viewDiscover() {
  return `<div class="wrap">
    <h1 class="page-title">Keşfet</h1>
    <form class="search" data-form="search" role="search">
      ${ICON.search}
      <input id="q" name="q" type="search" placeholder="Dizi ara" aria-label="Dizi ara" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" value="${esc(ui.q)}">
    </form>
    <div id="discover-results">${discoverResults()}</div>
    ${footer()}
  </div>`;
}
function renderDiscoverResults() {
  const el = $('#discover-results');
  if (!el) return;
  const fk = document.activeElement && el.contains(document.activeElement) ? document.activeElement.dataset.focus : null;
  el.innerHTML = discoverResults();
  if (fk) { const t = el.querySelector(`[data-focus="${CSS.escape(fk)}"]`); if (t) t.focus({ preventScroll: true }); }
  hydrate();
}
let searchCtrl = null, searchTimer = 0;
async function runSearch(force = false) {
  clearTimeout(searchTimer);
  const q = ui.q.trim();
  if (q.length < 2) { renderDiscoverResults(); return; }
  if (!force && ui.search.q === q && (ui.search.items || ui.search.loading)) return;
  if (searchCtrl) searchCtrl.abort();
  const ctrl = searchCtrl = new AbortController();
  ui.search = { q, loading: true, items: null, error: null };
  renderDiscoverResults();
  try {
    const items = await apiSearch(q, ctrl.signal);
    items.forEach(s => { const c = cache.get(s.id); if (!c || !c.eps) cache.set(s.id, s); });
    if (ui.search.q === q) ui.search = { q, loading: false, items, error: null };
  } catch (e) {
    if (e.name === 'AbortError') return;
    if (ui.search.q === q) ui.search = { q, loading: false, items: null, error: e };
  }
  if (route.view === 'discover') renderDiscoverResults();
}
async function loadSched(region) {
  if (ui.sched[region] && ui.sched[region].loading) return;
  ui.sched[region] = { loading: true };
  try {
    const items = await apiSchedule(region);
    items.forEach(s => { const c = cache.get(s.id); if (!c || !c.eps) cache.set(s.id, s); });
    ui.sched[region] = { items, at: Date.now() };
  } catch (e) {
    ui.sched[region] = { error: e };
  }
  if (route.view === 'discover') renderDiscoverResults();
  else if (route.view === 'watchlist') update();
}

/* ================= Dizi sayfası ================= */
function progressCard(s, st, now, followed) {
  const pct = st.aired ? Math.round(st.watchedAired / st.aired * 100) : 0;
  let nextBlock = '';
  if (followed && st.next) {
    const e = st.next;
    nextBlock = `<div class="next">
      <div><div class="label">Sıradaki bölüm</div>
        <div class="next-ep"><span class="epcode">${epLabel(s, e)}</span>${esc(e[E_NAME] || `Bölüm ${e[E_N]}`)}${resumeTag(e[E_ID])}</div>
        <div class="small muted">${esc(shortDate(e[E_AIR], now))} tarihinde yayınlandı</div></div>
      <button type="button" class="check" data-act="watch-next" data-id="${s.id}" data-ep="${e[E_ID]}" data-focus="next-${s.id}" aria-label="${epLabel(s, e)} izlendi olarak işaretle">${ICON.check}</button>
    </div>`;
  } else if (followed && st.aired && st.state !== 'stopped') {
    nextBlock = `<div><div class="label">Sıradaki bölüm</div><div class="next-ep">Yayınlanan bütün bölümleri izledin.</div></div>`;
  }
  let air;
  if (st.nextAir) {
    const e = st.nextAir;
    air = `<div class="label">Yeni bölüm</div><div><span class="epcode">${epLabel(s, e)}</span>${esc(airText(e, now))}</div><div class="small"><strong>${esc(relTime(e[E_AIR], now, e[E_TIME]))}</strong>${e[E_NAME] ? ` · ${esc(e[E_NAME])}` : ''}</div>${isYerli(s) ? `<div class="ext-links" style="margin-top:10px">${yerliLinks(s, e, now)}</div>` : ''}`;
  } else if (s.status === 'Ended') {
    air = `<div class="label">Durum</div><div>Dizi final yaptı. Toplam ${nf.format(st.total)} bölüm.</div>`;
  } else {
    air = `<div class="label">Yeni bölüm</div><div>${st.tba ? 'Yeni bölüm duyuruldu, tarihi henüz açıklanmadı.' : 'Yeni bölüm tarihi henüz açıklanmadı.'}</div>`;
  }
  return `<section class="pcard">

function epRow(s, e, now, counts) {

  </li>`;
}
function seasonsBlock(s, st, now) {

  const nums = [...by.keys()].sort((a, b) => a - b);
  if (!nums.length) return section('Sezonlar', 0, emptyCard('Bölüm listesi henüz yok.', 'TVmaze bu dizi için bölüm bilgisi yayınlamamış.'));
  if (!ui.open[s.id]) {
    const def = st.next ? st.next[E_S] : st.nextAir ? st.nextAir[E_S] : nums[nums.length - 1];
    ui.open[s.id] = new Set([def]);
  }
  const open = ui.open[s.id];
  const soc = ui.social[s.id];
  let counts = null;
  if (soc && soc.comments) {
    counts = new Map();
    for (const c of soc.comments) if (c.episode_id != null) counts.set(c.episode_id, (counts.get(c.episode_id) || 0) + 1);
  }
  const blocks = nums.map(n => {
    const eps = by.get(n);
    const aired = eps.filter(e => isAired(e, now));
    const w = eps.filter(e => D.watched[e[E_ID]]).length;
    const allOn = aired.length > 0 && aired.every(e => D.watched[e[E_ID]]);
    const pct = eps.length ? Math.round(w / eps.length * 100) : 0;
    const isOpen = open.has(n);
    const listId = `sezon-${s.id}-${n}`;
    return `<div class="season${isOpen ? ' is-open' : ''}">
      <div class="season-head">
        <button type="button" class="season-toggle" data-act="season-open" data-id="${s.id}" data-season="${n}" aria-expanded="${isOpen}"${isOpen ? ` aria-controls="${listId}"` : ''} data-focus="so-${n}">
          <span class="chev">${ICON.chev}</span><span class="season-name">${n}. Sezon</span><span class="season-count">${w}/${eps.length}</span>
        </button>
        <div class="bar bar-season" aria-hidden="true"><span style="width:${pct}%"></span></div>
        ${aired.length ? `<button type="button" class="btn btn-sm ${allOn ? 'btn-on' : 'btn-ghost'}" data-act="season-all" data-id="${s.id}" data-season="${n}" data-focus="sa-${n}">${allOn ? 'İşaretleri kaldır' : 'Sezonu izledim'}</button>` : '<span class="small muted">Yakında</span>'}
      </div>
      ${isOpen ? `<ol class="eps" id="${listId}">${eps.map(e => epRow(s, e, now, counts)).join('')}</ol>` : ''}
    </div>`;

  return section('Sezonlar', nums.length, blocks + '<p class="small muted" style="margin-top:10px">Bir bölümün adına dokunarak bölüm sayfasını açabilir, o bölüme yorum yazabilirsin.</p>');
}

async function ensureShow(id, force = false) {
  if (ui.showLoading.has(id) || (!force && ui.showErr.has(id))) return;
  const s = getShow(id);
  if (!force && s && s.eps && Date.now() - (s.fetchedAt || 0) < STALE_MS) return;
  const hadIds = !!(s && (s.imdb || s.tvdb));
  ui.showLoading.add(id);
  try {
    const fresh = await apiShow(id, { priority: true });
    if (D.shows[id]) { D.shows[id] = mergeShow(D.shows[id], fresh); save(); }
    else cache.set(id, fresh);
    if (!hadIds && (fresh.imdb || fresh.tvdb)) delete ui.ext[id];
    ui.showErr.delete(id);
  } catch (e) {
    ui.showErr.set(id, e);
    const c = getShow(id);
    if (c && c.eps) netError(() => { ui.showErr.delete(id); ensureShow(id, true); });
  } finally {
    ui.showLoading.delete(id);
    if ((route.view === 'show' || route.view === 'episode') && route.id === id) update();
  }
}

function tile(s, st) {

function shelf(title, rows, emptyTitle, emptyText, icon = '') {
  const body = rows.length ? `<div class="shelf">${rows.map(x => tile(x[0], x[1])).join('')}</div>` : emptyCard(emptyTitle, emptyText);

function historySection(now) {
  const idx = new Map();
  for (const s of Object.values(D.shows)) for (const e of s.eps || []) idx.set(e[E_ID], [s, e]);
  const entries = Object.entries(D.watched).map(([k, w]) => [+k, w[0], w[1]]).filter(x => idx.has(x[0])).sort((a, b) => b[2] - a[2]);
  const groups = [];
  for (const [epId, sid, t] of entries) {
    const last = groups[groups.length - 1];
    if (last && last.sid === sid && last.t === t) { last.eps.push(idx.get(epId)[1]); continue; }
    if (groups.length >= 10) break;
    groups.push({ sid, t, show: idx.get(epId)[0], eps: [idx.get(epId)[1]] });
  }
  if (!groups.length) return section('Son izlenenler', 0, emptyCard('Henüz bölüm işaretlemedin.', 'İzleme listesindeki işaret kutusuna dokunduğunda izlediğin bölümler burada sıralanır.'));
  const rows = groups.map(g => {
    g.eps.sort((a, b) => a[E_S] - b[E_S] || a[E_N] - b[E_N]);
    const a = g.eps[0], b = g.eps[g.eps.length - 1];
    const label = g.eps.length === 1
      ? `<span class="epcode">${epLabel(g.show, a)}</span>${esc(a[E_NAME] || '')}`
      : `<span class="epcode">${epLabel(g.show, a)}</span>– <span class="epcode">${epLabel(g.show, b)}</span>${nf.format(g.eps.length)} bölüm`;
    return `<li><a href="#dizi-${g.show.id}">${poster(g.show, 'poster-xs')}<span class="hist-body"><span class="hist-show">${showTitleHtml(g.show)}</span><span class="hist-ep">${label}</span></span><span class="hist-when">${esc(relTime(g.t, now))}</span></a></li>`;
  }).join('');
  return section('Son izlenenler', 0, `<ul class="hist">${rows}</ul>`);
}
function genreSection(rows) {

}

/* ================= İşlemler ================= */
function markEp(show, e, on, t) {
  if (on) { D.watched[e[E_ID]] = [show.id, t]; delete D.resume[e[E_ID]]; }
  else delete D.watched[e[E_ID]];
}
const snapshot = eps => eps.map(e => [e[E_ID], D.watched[e[E_ID]]]);
const restore = snap => { for (const [k, v] of snap) { if (v) D.watched[k] = v; else delete D.watched[k]; } };
const finishedMsg = s => `Tebrikler! ${s.name} bitti. Profilindeki Bitirdiklerim listesine eklendi.`;

function setBusy(btn) {
  if (!btn || !btn.isConnected) return;
  btn.disabled = true;
  btn.innerHTML = '<span class="spin-sm" aria-hidden="true"></span><span>Ekleniyor</span>';
}
async function follow(id, btn) {
  if (D.shows[id]) return D.shows[id];
  let s = cache.get(id);
  if (!s || !s.eps) {
    setBusy(btn);
    try { s = await apiShow(id, { priority: true }); cache.set(id, s); }
    catch (e) { update(); netError(() => follow(id)); return null; }
  }
  if (D.shows[id]) return D.shows[id];
  D.shows[id] = { ...s, addedAt: Date.now(), fav: false, stopped: false };
  delete D.shows[id].today;
  save(); update();
  toast({ text: `${s.name} takip listene eklendi.` });
  syncTrNames();
  return D.shows[id];
}
async function unfollow(id) {
  const s = D.shows[id];
  if (!s) return;
  const marks = Object.entries(D.watched).filter(([, w]) => w[0] === s.id);
  const ok = await dialog({
    title: 'Takipten çıkılsın mı?',
    text: marks.length ? `${s.name} listenden kalkar ve bu dizide işaretlediğin ${marks.length} bölüm silinir.` : `${s.name} listenden kalkar.`,
    ok: 'Takipten çık', danger: true,
  });
  if (!ok) return;
  marks.forEach(([k]) => delete D.watched[k]);
  cache.set(s.id, s);
  delete D.shows[id];
  save(); update();
  toast({ text: `${s.name} takipten çıkarıldı.`, actions: [{ label: 'Geri al', fn: () => { D.shows[id] = s; marks.forEach(([k, w]) => { D.watched[k] = w; }); save(); update(); } }] });
}
async function watchNext(id, epId, btn) {
  const s = D.shows[id];
  const e = s && (s.eps || []).find(x => x[E_ID] === epId);
  if (!e || D.watched[epId]) return;
  const before = stats(s).state;
  markEp(s, e, true, Date.now());
  save();
  if (btn && !reducedMotion()) { btn.classList.add('is-done'); btn.disabled = true; await sleep(260); }
  update();
  const undo = { label: 'Geri al', fn: () => { markEp(s, e, false); save(); update(); } };
  const after = stats(s).state;
  toast({ text: after === 'finished' && before !== 'finished' ? finishedMsg(s) : `${s.name} · ${epLabel(s, e)} izlendi.`, actions: [undo], timeout: after === 'finished' ? 8000 : 5500 });
}
async function toggleEp(id, epId) {
  const s = D.shows[id] || await follow(id);
  if (!s) return;
  const e = (s.eps || []).find(x => x[E_ID] === epId);
  if (!e) return;
  const now = Date.now();
  const on = !D.watched[epId];
  const before = stats(s, now).state;
  markEp(s, e, on, now);
  save(); update();
  if (!on) return;
  const idx = s.eps.indexOf(e);
  const prev = s.eps.slice(0, idx).filter(x => isAired(x, now) && !D.watched[x[E_ID]]);
  if (prev.length) {
    toast({ text: `Önceki ${prev.length} bölümü de izledin mi?`, timeout: 12000, actions: [
      { label: 'Hayır' },
      { label: 'Evet, işaretle', fn: () => {
        prev.forEach(x => markEp(s, x, true, now)); save(); update();
        toast({ text: stats(s).state === 'finished' && before !== 'finished' ? finishedMsg(s) : `${prev.length} bölüm daha izlendi olarak işaretlendi.`, actions: [{ label: 'Geri al', fn: () => { prev.forEach(x => markEp(s, x, false)); save(); update(); } }] });
      } },
    ] });
  } else if (stats(s).state === 'finished' && before !== 'finished') {
    toast({ text: finishedMsg(s), timeout: 8000 });
  }
}
async function toggleSeason(id, n) {
  const s = D.shows[id] || await follow(id);
  if (!s) return;
  const now = Date.now();
  const eps = s.eps.filter(e => e[E_S] === n && isAired(e, now));
  if (!eps.length) return;
  const before = stats(s, now).state;
  const allOn = eps.every(e => D.watched[e[E_ID]]);
  const snap = snapshot(eps);
  eps.forEach(e => markEp(s, e, !allOn, now));
  save(); update();
  const fin = !allOn && stats(s).state === 'finished' && before !== 'finished';
  toast({ text: fin ? finishedMsg(s) : allOn ? `${n}. sezonun işaretleri kaldırıldı.` : `${n}. sezon izlendi olarak işaretlendi.`, actions: [{ label: 'Geri al', fn: () => { restore(snap); save(); update(); } }] });
}
async function markAll(id) {
  const s = D.shows[id] || await follow(id);
  if (!s) return;

async function refreshAll(force = false) {
  if (syncing) return;

    .then(fresh => {

      D.shows[id] = mergeShow(old, fresh);
      if (!old.imdb && !old.tvdb && (fresh.imdb || fresh.tvdb)) delete ui.ext[id];
    })
    .catch(() => { syncing.failed++; })
    .finally(() => { syncing.done++; renderSync(); })));
